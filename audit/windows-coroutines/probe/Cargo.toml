[package]
name = "windows-coroutines-probe"
version = "0.1.0"
edition = "2024"
publish = false

# The Win64 coroutine milestone's experiments (WINDOWS-X86-64-MILESTONE-5.md,
# "Architecture comparison"): Windows fibers (CreateFiberEx, SwitchToFiber)
# against a stack switch of our own, each run on a real Windows host --
# the registers a switch keeps, the thread's TLS and the fiber's FLS, the
# stack bounds Windows reports while each stack runs, guard-page growth,
# stack guarantees, genuine exhaustion, Rust's unwinding and Windows'
# virtual unwind across the stacks, a fiber's lifetime and the cost of
# each. Independent of botlish-native: nothing here is production code,
# and nothing in native/ reads it.
[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[build-dependencies]
cc = "1"

[profile.release]
debug = 1
