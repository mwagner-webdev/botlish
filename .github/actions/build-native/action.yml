name: Build native (Cranelift) backend
description: >
  Builds native/'s Rust driver (botlish-native), caching its dependency
  build. Centralizes the one piece of Cranelift-support logic every
  workflow that touches the native backend needs, so it is fixed and
  upgraded in one place instead of three near-identical copies.

runs:
  using: composite
  steps:
    # native/Cargo.lock pins the dependency graph, so it is the cache key: a
    # hit skips rebuilding cranelift/wasmtime-internal-* (the bulk of
    # native/'s build time) entirely.
    - name: Cache native backend build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          native/target
        key: native-cargo-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
        restore-keys: native-cargo-${{ runner.os }}-

    # native/Cargo.toml's pinned cranelift-*/wasmtime-internal-* crates need
    # rustc 1.95+ (see AGENTS.md); the runner's preinstalled default can be
    # older, so this always pins `stable` rather than trusting whatever is
    # already selected.
    - name: Build native backend
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        cargo build --release --manifest-path native/Cargo.toml
