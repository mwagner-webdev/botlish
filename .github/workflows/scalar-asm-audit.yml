name: scalar-asm-audit

# Regenerates the committed disassembly corpus under
# audit/native-scalar-asm/ (see that directory's README.md and
# /SCALAR-ASM-AUDIT.md) whenever something that could change it lands on
# main, and pushes the result straight back -- this repo has no
# feature-branch-plus-PR review cycle (AGENTS.md), and the corpus is
# explicitly a "temporary diagnostic snapshot", not something to let drift.
#
# Paths are scoped to what native/generate-scalar-audit.tcl's own output
# actually depends on (the compiler pipeline down to Cranelift, the
# bench/*.ir and examples/stdlib/*.bot corpus it audits, and the script
# itself) -- not on audit/native-scalar-asm/** or *.md, so this workflow's
# own commit back to main never re-triggers itself.

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "hir/**"
      - "compiler/**"
      - "surface/**"
      - "lib/**"
      - "native/lower.tcl"
      - "native/native.tcl"
      - "native/generate-scalar-audit.tcl"
      - "native/src/**"
      - "native/Cargo.toml"
      - "native/Cargo.lock"
      - "bench/*.ir"
      - "examples/stdlib/*.bot"
      - "examples/stdlib/corpus.tcl"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalar-asm-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      # fetch-depth: 0 (not the default shallow clone): the commit-and-push
      # step below rebases onto the ref's current tip before pushing, which
      # needs this run's checkout commit's ancestry to still be reachable.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ubuntu-latest (noble) ships only Tcl 8.6; Botlish's Tcl reference
      # implementation requires Tcl 9.x (see README's introduction and
      # core/core.tcl's version check), so Tcl 9 is installed from Ubuntu
      # 25.04 (plucky)'s universe pool instead, exactly as tests.yml/
      # bench.yml do.
      - name: Install Tcl 9
        run: |
          set -eu
          cd /tmp
          base=http://archive.ubuntu.com/ubuntu/pool/universe
          curl -fsSLO "$base/libt/libtommath/libtommath1_1.3.0-1_amd64.deb"
          curl -fsSLO "$base/t/tcl9.0/libtcl9.0_9.0.1+dfsg-1_amd64.deb"
          curl -fsSLO "$base/t/tcl9.0/tcl9.0_9.0.1+dfsg-1_amd64.deb"
          sudo dpkg -i libtommath1_1.3.0-1_amd64.deb libtcl9.0_9.0.1+dfsg-1_amd64.deb tcl9.0_9.0.1+dfsg-1_amd64.deb
          echo 'puts "Tcl [info patchlevel], tcltest [package require tcltest 2.5]"' | tclsh9.0

      # generate-scalar-audit.tcl's native::object needs the Cranelift
      # backend built.
      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - name: Regenerate the scalar assembly audit corpus
        run: tclsh9.0 native/generate-scalar-audit.tcl

      - name: Check for changes
        id: diff
        run: |
          git add -A audit/native-scalar-asm
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate the scalar assembly audit corpus" \
            -m "Auto-generated by .github/workflows/scalar-asm-audit.yml from ${{ github.sha }} with native/generate-scalar-audit.tcl."
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
