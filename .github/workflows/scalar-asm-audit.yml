name: scalar-asm-audit

# Regenerates the committed disassembly corpus under
# audit/native-scalar-asm/ (see that directory's README.md and
# /SCALAR-ASM-AUDIT.md) whenever something that could change it lands on
# main, and pushes the result straight back -- this repo has no
# feature-branch-plus-PR review cycle (AGENTS.md), and the corpus is
# explicitly a "temporary diagnostic snapshot", not something to let drift.
#
# Paths are scoped to what native/generate-scalar-audit.tcl's own output
# actually depends on (the compiler pipeline down to Cranelift, the
# bench/*.ir and examples/stdlib/*.bot corpus it audits, and the script
# itself) -- not on audit/native-scalar-asm/** or *.md, so this workflow's
# own commit back to main never re-triggers itself.

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "hir/**"
      - "compiler/**"
      - "surface/**"
      - "lib/**"
      - "native/lower.tcl"
      - "native/native.tcl"
      - "native/generate-scalar-audit.tcl"
      - "native/src/**"
      - "native/Cargo.toml"
      - "native/Cargo.lock"
      - "bench/*.ir"
      - "examples/stdlib/*.bot"
      - "examples/stdlib/corpus.tcl"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalar-asm-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      # fetch-depth: 0 (not the default shallow clone): the commit-and-push
      # step below rebases onto the ref's current tip before pushing, which
      # needs this run's checkout commit's ancestry to still be reachable.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Keep the devcontainer and GitHub Actions prerequisite setup in one
      # place so they stay in sync.
      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      # native/Cargo.lock pins the dependency graph, so it is the cache
      # key: a hit skips rebuilding cranelift/wasmtime-internal-* (the bulk
      # of native/'s build time) entirely -- same pattern as bench.yml.
      - name: Cache native backend build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-cargo-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: native-cargo-${{ runner.os }}-

      # generate-scalar-audit.tcl's native::object needs rustc 1.95+ for
      # the pinned cranelift-*/wasmtime-internal-* crates (AGENTS.md):
      # ubuntu-latest's preinstalled default can be older, so this always
      # pins `stable` rather than trusting whatever is already selected.
      - name: Build the native backend
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --release --manifest-path native/Cargo.toml

      - name: Regenerate the scalar assembly audit corpus
        run: tclsh9.0 native/generate-scalar-audit.tcl

      - name: Check for changes
        id: diff
        run: |
          git add -A audit/native-scalar-asm
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate the scalar assembly audit corpus" \
            -m "Auto-generated by .github/workflows/scalar-asm-audit.yml from ${{ github.sha }} with native/generate-scalar-audit.tcl."
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
