name: tests (macos arm64)

# The macOS Apple Silicon port's CI (MACOS-AARCH64-PORT-AUDIT.md, section
# 16): real arm64 macOS runners for an agent that develops on Linux. The
# native backend is being ported milestone by milestone; these jobs test what
# runs on macOS today (the JIT and, since milestone 3, native coroutines and
# the native golden runner) and check that what does not is refused the way
# the audit records.
#
#   smoke          Tier A, every push: the host and its C and Rust
#                  toolchains (not Botlish), Tcl 9.0.1, core::cabi's macOS row,
#                  the native build and its Rust unit tests, the native stack
#                  bounds and overflow tests, the native status, native
#                  objects and executables (tests/platform/aot-facts.tcl),
#                  the smoke tier (tests/platform/tier.tcl smoke)
#   system-linker  every push: the system linker (SINGLE-EXECUTABLE-FFI-
#                  MILESTONE-1.md) -- Apple clang and ld, the precompiled
#                  runtime archive, no rustc -- its tests and the executable
#                  and C test files linked by it
#   acceptance     Tier B, every push, two shards: the acceptance tier --
#                  the test files and golden suites that pass on macOS
#   app            every push: the macOS distribution, Botlish.app
#                  (MACOS-AARCH64-MILESTONE-9.md) -- built, signed ad hoc,
#                  verified, its packaging census, accepted outside the
#                  checkout, compared with the checkout's compiler, measured
#                  -- and its download archive the run's
#                  botlish-macos-aarch64 artifact
#   app-clean      every push, after app: the downloaded application on the
#                  runner with Apple's developer tools, Rust and the
#                  checkout moved away
#   link-plan-sdl3 every push, after app: the downloaded application links
#                  static SDL3 (built from its pinned release) with the
#                  frameworks SDL3 needs (NATIVE-LINK-PLAN-MILESTONE-1.md)
#   app-mutants    opt-in, "[ci-app-mutants]" in the pushed head commit's
#                  message (or a manual run's app_mutants): the
#                  application's packaging mutants
#   linux control  Tier A on ubuntu-latest, every push: the same smoke
#                  commands on Linux x86-64, for telling a macOS failure from
#                  a Linux one at the same commit
#   full           Tier C, opt-in: "[ci-full]" in the pushed head commit's
#                  message, or a manual run with tier "full". By default
#                  three shards of the acceptance tier (Tcl test files on both Tcl
#                  backends, golden suites on all four)
#                  under BOTLISH_NATIVE_GC_STRESS=1; with a "CI-Tests:"
#                  trailer in that commit message (or the "tests" input)
#                  exactly the tier.tcl items it names -- "CI-Tests:
#                  coroutines.test enums.bot", or "all" for the whole census
#                  -- under GC stress only with a "CI-GC-Stress: 1" trailer
#                  (or the "gc_stress" input)
#
# Pushes to any branch run it, so a feature branch gets macOS results before
# this file is on main; a pull request from this repository's own branches
# skips (its push already ran), one from a fork runs. Documentation-only
# pushes skip. A newer push to the same branch cancels a running one, except
# on main. No macOS job waits for a Linux runner. A manual run with app_only
# runs only the application's jobs. The runner label, macos-15
# (an Apple Silicon image; the smoke job fails on anything else), is written
# in the smoke, acceptance and full jobs: change all three together.

on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      tier:
        description: "acceptance: the ordinary jobs; full: also Tier C"
        type: choice
        options: [acceptance, full]
        default: acceptance
      tests:
        description: "Tier C's items instead of its default payload (tests/platform/tier.tcl items, space-separated: X.test, X.bot, smoke, acceptance, all, rust, native-stack-mutants, native-aot-mutants, native-stack-bench, c-ffi-fuzz, c-ffi-mutants[=NAME,...], c-ffi-bench, c-borrow-fuzz, c-borrow-mutants[=NAME,...], c-borrow-bench, darwin-io-mutants, darwin-io-bench, c-capture-bench)"
        required: false
        default: ""
      gc_stress:
        description: "Run the named Tier C items under BOTLISH_NATIVE_GC_STRESS=1"
        type: boolean
        default: false
      app_only:
        description: "Run only the application's jobs (app, app-clean; MACOS-AARCH64-MILESTONE-9.md)"
        type: boolean
        default: false
      app_mutants:
        description: "Also run the application's mutants (app-mutants)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # bash -eo pipefail (a step's default shell on macOS is /bin/bash -e,
    # without pipefail, which would hide a failure piped through tee).
    shell: bash

jobs:
  smoke:
    name: smoke (Tier A, macOS arm64)
    # A same-repository pull request's push run already covers its commits.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) && !inputs.app_only
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Host
        run: |
          sw_vers
          uname -a
          echo "CPUs: $(sysctl -n hw.ncpu), memory: $(sysctl -n hw.memsize) bytes, page size: $(getconf PAGESIZE)"
          echo "Xcode: $(xcode-select -p), SDK $(xcrun --show-sdk-version)"
          if [[ $(uname -s) != Darwin || $(uname -m) != arm64 ]]; then
            echo "::error::not a native arm64 macOS runner: $(uname -s) $(uname -m)"
            exit 1
          fi
          if [[ $(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0) == 1 ]]; then
            echo "::error::this shell runs under Rosetta translation"
            exit 1
          fi

      # The toolchain, not Botlish: a C program (also linked against a
      # static library) and Rust programs built and run as Mach-O arm64.
      - name: Toolchain smoke (C, Rust, Cargo; not Botlish)
        run: tests/platform/toolchain-smoke.sh

      - name: Install prerequisites (Tcl 9.0.1, stable Rust)
        uses: ./.github/actions/setup-macos

      - name: C ABI facts against core::cabi's macos-aarch64 row
        run: tclsh9.0 tests/platform/cabi-facts.tcl

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      # The runtime's tests and the driver's own (--bins): its link plans,
      # targets and the Apple C signature, which Cranelift's AArch64 backend
      # compiles here.
      - name: Native Rust unit tests
        run: cargo test --release --manifest-path native/Cargo.toml --lib --bins

      # The host's stack bounds and guards and the runtime's overflow guard,
      # checked in child processes (native/tests/native_stack.rs, milestone 4):
      # its log records the macOS stack facts it observed.
      - name: Native stack bounds and overflow (isolated processes)
        run: cargo test --release --manifest-path native/Cargo.toml --test native_stack

      # Each native capability works or is refused exactly as recorded for
      # macos-aarch64 (MACOS-AARCH64-PORT-AUDIT.md, section 15).
      - name: Native status
        run: tclsh9.0 tests/platform/native-status.tcl -verbose 1

      - name: Smoke tier
        run: tclsh9.0 tests/platform/tier.tcl smoke 2>&1 | tee tier.log

      # A program object and a standalone executable as the host's tools see
      # them (file, nm, objdump, otool, lipo, codesign), the executable run
      # outside its build directory, the link command and timings
      # (milestone 5). Last, so that its lines are the log's last.
      - name: Native objects and executables
        if: always()
        run: tclsh9.0 tests/platform/aot-facts.tcl -verbose 1

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Smoke (macOS arm64)"
            echo '```'
            awk '/^######## .*: (ok|FAILED)/ {print} /^######## [0-9]+ commands/ {tail = 1} tail {print}' tier.log 2>/dev/null | grep -a . || echo "the smoke tier did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The system linker on macOS (SINGLE-EXECUTABLE-FFI-MILESTONE-1.md):
  # executables linked by Apple clang and Apple's ld from the program object
  # and the precompiled runtime archive -- no rustc at link time -- and the executable and C test files linked by it, plainly
  # and (the C ones) under GC stress.
  system-linker:
    name: system linker (macOS arm64)
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) && !inputs.app_only
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BOTLISH_NATIVE_LINKER: system
    steps:
      - uses: actions/checkout@v5

      - name: Install prerequisites (Tcl 9.0.1, stable Rust)
        uses: ./.github/actions/setup-macos

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - name: What the system linker links with
        run: |
          native/target/release/botlish-native system-linker
          tclsh9.0 native/runtime-archive/libraries.tcl

      # A system-linked executable: the link command (BOTLISH_NATIVE_LINK_LOG),
      # its run, the Mach-O as the host's tools see it.
      - name: A system-linked executable
        run: |
          mkdir -p sl && cp examples/io/hello-darwin.bot sl/ 2>/dev/null || cp examples/io/hello.bot sl/
          for f in sl/*.bot; do
            BOTLISH_NATIVE_LINK_LOG=$PWD/link.log tclsh9.0 main.tcl -warnings off -emit-native-executable "$f"
          done
          cat link.log
          for exe in sl/*; do [[ $exe == *.bot ]] && continue; file "$exe"; otool -L "$exe"; "$exe"; done

      - name: The system linker's tests
        run: tclsh9.0 tests/all.tcl -file system-linker.test

      - name: Executable and C tests, system-linked
        run: |
          files=$(grep -l -e 'native::executable' -e 'emit-native-executable' -e 'extern c ' tests/*.test | xargs -n1 basename | tr '\n' ' ')
          CORE_BACKEND=interp tclsh9.0 tests/all.tcl -file "$files"

      - name: System linker and C tests under GC stress
        env:
          BOTLISH_NATIVE_GC_STRESS: "1"
        run: tclsh9.0 tests/all.tcl -file "system-linker.test c-ffi.test darwin-io.test c-byte-borrowing.test c-ffi-error-capture.test coroutines.test native-link-plan.test"

  # The macOS distribution of the compiler (MACOS-AARCH64-MILESTONE-9.md):
  # Botlish.app -- the launcher, the bundled Tcl.framework, the compiler's
  # ZIP archive, the native backend and the runtime archive -- built, signed
  # ad hoc and verified (single/macos/build.sh), inspected, probed (the
  # packaging census), then accepted from outside the checkout, its framework
  # build hidden: the packaged-compiler smoke tests, the application's own
  # (single/macos/app-test.sh) and the comparison with this checkout's
  # compiler (single/macos/compare.sh), with Apple's developer tools; the
  # sizes and startup times. Every check runs even when an earlier one fails.
  # Only a build that passes all of them is uploaded as the run's
  # botlish-macos-aarch64 artifact (the download archive and its checksum:
  # ad-hoc signed, not notarized); the logs always are.
  app:
    name: Botlish.app (macOS arm64 distribution)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install prerequisites (Tcl 9.0.1, stable Rust)
        uses: ./.github/actions/setup-macos

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      # single/macos/build.sh keys its framework build by the recipe:
      # tcl-framework.sh and the Tcl pin in single/build.sh.
      - name: Cache the Tcl.framework build
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/botlish-app
          key: app-tcl-framework-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('single/macos/tcl-framework.sh', 'single/build.sh') }}

      - name: Build Botlish.app
        run: single/macos/build.sh -o dist 2>&1 | tee build.log

      - name: Inspect the application
        if: always()
        run: |
          app=dist/Botlish.app
          set -x
          find "$app" -maxdepth 6 -not -path '*/Scripts/*' -not -path '*/tcl9/*' | sort
          ls -l@ "$app/Contents" "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/Frameworks/Tcl.framework" "$app/Contents/Frameworks/Tcl.framework/Versions"
          cat "$app/Contents/Info.plist"
          for f in MacOS/botlish MacOS/botlish-native Frameworks/Tcl.framework/Versions/9.0/Tcl; do
            file "$app/Contents/$f"; lipo -archs "$app/Contents/$f"; otool -L "$app/Contents/$f"
            otool -l "$app/Contents/$f" | grep -A4 -E 'LC_RPATH|LC_BUILD_VERSION|LC_ID_DYLIB|LC_LOAD_WEAK_DYLIB'
          done
          lipo -info "$app/Contents/Resources/libbotlish_runtime.a"
          for f in . Contents/Frameworks/Tcl.framework/Versions/9.0 Contents/MacOS/botlish-native; do codesign -dvvv --entitlements - "$app/$f"; done
          codesign --verify --deep --strict --verbose=4 "$app"
          spctl --assess --type execute --verbose=4 "$app" || true
          unzip -l "$app/Contents/Resources/botlish.zip" | tail -3
          cat dist/botlish-macos-aarch64.zip.sha256
          "$app/Contents/MacOS/botlish" -version

      # The launcher in a directory with non-ASCII characters, with and
      # without a locale: a crash's report and lldb's backtrace, for the
      # log. (Diagnostics; the acceptance below decides.)
      - name: Packaging census
        if: always()
        run: audit/macos-app/tools/census.sh "$(ls -d ~/Library/Caches/botlish-app/tcl-framework-* | head -n 1)" dist/Botlish.app 2>&1 | tee census.log

      # The application moved out of the checkout into a path with a space
      # and non-ASCII characters; the framework's build (and its staging)
      # made inaccessible; the download archive extracted there by unzip.
      - name: Place the application outside the checkout
        if: always()
        run: |
          place="$RUNNER_TEMP/Prögram Files"
          mkdir -p "$place"
          (cd "$place" && unzip -q "$GITHUB_WORKSPACE/dist/botlish-macos-aarch64.zip")
          echo "APP=$place/Botlish.app" >>"$GITHUB_ENV"
          mv ~/Library/Caches/botlish-app ~/Library/Caches/botlish-app.hidden
          single/macos/verify.sh --checkout "$PWD" "$place/Botlish.app"

      - name: Packaged-compiler smoke test (single/smoke-test.sh)
        if: always()
        run: bash single/smoke-test.sh "$APP/Contents/MacOS/botlish" 2>&1 | tee smoke.log

      - name: C FFI smoke test (single/ffi-smoke-test.sh)
        if: always()
        run: bash single/ffi-smoke-test.sh "$APP/Contents/MacOS/botlish" 2>&1 | tee ffi-smoke.log

      - name: The application's acceptance (single/macos/app-test.sh)
        if: always()
        run: bash single/macos/app-test.sh "$APP" 2>&1 | tee app-test.log

      - name: The application against the checkout (single/macos/compare.sh)
        if: always()
        run: bash single/macos/compare.sh "$(command -v tclsh9.0)" "$APP" 2>&1 | tee compare.log

      - name: Sizes and startup times (bench/macos-app.tcl)
        if: always()
        run: tclsh9.0 bench/macos-app.tcl "$APP" dist/botlish-macos-aarch64.zip 2>&1 | tee measure.log

      - name: The application, untouched by the runs
        if: always()
        run: codesign --verify --deep --strict --verbose=2 "$APP"

      # (The cache's post step saves the framework build from its path.)
      - name: Restore the framework build's cache directory
        if: always()
        run: if [ -d ~/Library/Caches/botlish-app.hidden ]; then mv ~/Library/Caches/botlish-app.hidden ~/Library/Caches/botlish-app; fi

      - uses: actions/upload-artifact@v4
        with:
          name: botlish-macos-aarch64
          path: |
            dist/botlish-macos-aarch64.zip
            dist/botlish-macos-aarch64.zip.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: botlish-macos-aarch64-logs
          path: "*.log"
          if-no-files-found: warn

  # The application on a Mac without the developer tools and without any of
  # what built it: the uploaded download archive extracted (unzip), this
  # checkout deleted (its scripts and examples copied out first), Rust's
  # directories moved away, and Apple's developer tools -- every Xcode and
  # the Command Line Tools -- moved away, so that the shims in /usr/bin
  # (cc, clang, otool, git ...) report "no developer tools" exactly as on a
  # fresh Mac. Then: the signature, the toolchain-free smoke test (the
  # analysis, Compilerpedia, the language server, the interpreter, the Tcl
  # compiler, the native JIT; an executable refused with NATIVE LINK
  # TOOLCHAIN and xcode-select --install).
  app-clean:
    name: Botlish.app without developer tools (macOS arm64)
    needs: app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # (No credentials kept: nothing is left for a post step, which would
      # need git, a developer tool, in the checkout this job deletes.)
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: botlish-macos-aarch64
          path: download

      - name: What this Mac has before
        run: |
          sw_vers; xcode-select -p || true
          ls -d /Applications/Xcode*.app /Library/Developer/CommandLineTools 2>/dev/null || true
          for t in tclsh tclsh9.0 wish rustc cargo cc clang; do echo "$t: $(command -v $t || echo none)"; done
          ls /opt/homebrew/bin 2>/dev/null | grep -i -E '^(tcl|wish)' || echo "no Homebrew Tcl"

      - name: Extract the download; copy the tests out; delete the checkout
        run: |
          kit="$RUNNER_TEMP/kit"
          mkdir -p "$kit/single/macos" "$kit/examples" "$RUNNER_TEMP/Clean Äpps"
          cp single/smoke-test.sh "$kit/single/"
          cp single/macos/verify.sh "$kit/single/macos/"
          cp -R examples/surface examples/stdlib examples/hir examples/io examples/linux "$kit/examples/"
          (cd download && shasum -a 256 -c botlish-macos-aarch64.zip.sha256)
          (cd "$RUNNER_TEMP/Clean Äpps" && unzip -q "$GITHUB_WORKSPACE/download/botlish-macos-aarch64.zip")
          cd /
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]*
          mv ~/.cargo ~/.cargo.hidden 2>/dev/null || true
          mv ~/.rustup ~/.rustup.hidden 2>/dev/null || true

      - name: Move Apple's developer tools away
        run: |
          sudo mkdir -p /private/var/hidden-developer
          for d in /Applications/Xcode*.app /Library/Developer/CommandLineTools; do
            if [ -e "$d" ]; then sudo mv "$d" /private/var/hidden-developer/; fi
          done
          echo "xcode-select -p: $(xcode-select -p 2>&1)"
          if /usr/bin/cc --version >"$RUNNER_TEMP/cc.out" 2>&1; then cat "$RUNNER_TEMP/cc.out"; echo "::error::cc still runs"; exit 1; fi
          echo "/usr/bin/cc now says:"; cat "$RUNNER_TEMP/cc.out"

      - name: The signature and the bundle, without developer tools
        run: |
          app="$RUNNER_TEMP/Clean Äpps/Botlish.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          bash "$RUNNER_TEMP/kit/single/macos/verify.sh" --no-developer-tools "$app"

      - name: Toolchain-free smoke test
        run: bash "$RUNNER_TEMP/kit/single/smoke-test.sh" "$RUNNER_TEMP/Clean Äpps/Botlish.app/Contents/MacOS/botlish"

  # Static SDL3 through the distribution (NATIVE-LINK-PLAN-MILESTONE-1.md,
  # "Static SDL3"): the uploaded application extracted outside the checkout
  # links an application that declares SDL3's static archive by a path from
  # its root and the Apple frameworks SDL3's own metadata names
  # (tests/platform/link-plan-sdl3.sh: SDL3 built from the binding profile's
  # pinned release, static and shared; the static executable's dynamic
  # libraries, its value, the static/shared collision, the dynamic control,
  # the application moved, the checkout's compiler with both linkers, every
  # executable run again with SDL3 deleted). The SDL3 build is cached by its
  # pinned commit.
  link-plan-sdl3:
    name: static SDL3 through Botlish.app (macOS arm64)
    needs: app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install prerequisites (Tcl 9.0.1, stable Rust)
        uses: ./.github/actions/setup-macos

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - uses: actions/download-artifact@v4
        with:
          name: botlish-macos-aarch64
          path: download

      - name: Cache the static SDL3 build
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/botlish-sdl3-static
          key: sdl3-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/c-bindgen/profiles/sdl3.tcl', 'tests/platform/link-plan-sdl3.sh') }}

      - name: Static SDL3 (tests/platform/link-plan-sdl3.sh)
        run: |
          place="$RUNNER_TEMP/Prögram Files"
          mkdir -p "$place"
          (cd download && shasum -a 256 -c botlish-macos-aarch64.zip.sha256)
          (cd "$place" && unzip -q "$GITHUB_WORKSPACE/download/botlish-macos-aarch64.zip")
          export BOTLISH_SDL3_STATIC_PREFIX="$HOME/Library/Caches/botlish-sdl3-static"
          bash tests/platform/link-plan-sdl3.sh "$place/Botlish.app" "$(command -v tclsh9.0)" 2>&1 | tee link-plan-sdl3.log
          codesign --verify --deep --strict --verbose=2 "$place/Botlish.app"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-plan-sdl3-log
          path: link-plan-sdl3.log
          if-no-files-found: warn

  # Mutation testing of the application's packaging (opt-in: "[ci-app-
  # mutants]" in the pushed head commit's message, or a manual run's
  # app_mutants): audit/macos-app/tools/
  # mutate.tcl, and the driver's share of it, the native-aot mutants of the
  # bundle's runtime archive, the toolchain remedy and an executable's search
  # path.
  app-mutants:
    name: Botlish.app mutants (macOS arm64)
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
      && (contains(github.event.head_commit.message, '[ci-app-mutants]') || inputs.app_mutants)
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Install prerequisites (Tcl 9.0.1, stable Rust)
        uses: ./.github/actions/setup-macos

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - name: Cache the Tcl.framework build
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/botlish-app
          key: app-tcl-framework-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('single/macos/tcl-framework.sh', 'single/build.sh') }}

      - name: Build Botlish.app (and the framework, unless cached)
        run: single/macos/build.sh -o dist

      - name: The application's mutants
        if: always()
        run: tclsh9.0 audit/macos-app/tools/mutate.tcl -tcl-framework "$(ls -d ~/Library/Caches/botlish-app/tcl-framework-* | head -n 1)" 2>&1 | tee app-mutants.log

      - name: The driver's mutants of the application's share
        if: always()
        run: tclsh9.0 audit/native-aot/tools/mutate.tcl -only sys-runtime-bundle-ignored,sys-runtime-bundle-relative,sys-runtime-bundle-remedy-build,sys-apple-remedy-rust,sys-executable-rpath 2>&1 | tee native-aot-mutants.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: botlish-macos-app-mutants
          path: "*.log"
          if-no-files-found: warn

  acceptance:
    name: acceptance (Tier B, macOS arm64, shard ${{ matrix.shard }}/2)
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) && !inputs.app_only
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      - name: Install prerequisites (Tcl 9.0.1, stable Rust)
        uses: ./.github/actions/setup-macos

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - name: Acceptance tier, this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: tclsh9.0 tests/platform/tier.tcl -shard "$SHARD/2" -backends interp acceptance 2>&1 | tee tier.log

      - name: Publish summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          {
            echo "## Acceptance (macOS arm64), shard $SHARD/2"
            echo '```'
            awk '/^######## .*: (ok|FAILED)/ {print} /^######## [0-9]+ commands/ {tail = 1} tail {print}' tier.log 2>/dev/null | grep -a . || echo "the acceptance tier did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  linux-control:
    name: linux control (Tier A, ubuntu x86-64)
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) && !inputs.app_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain smoke (C, Rust, Cargo; not Botlish)
        run: tests/platform/toolchain-smoke.sh

      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      - name: C ABI facts against core::cabi's linux-x86_64 row
        run: tclsh9.0 tests/platform/cabi-facts.tcl

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - name: Native status
        run: tclsh9.0 tests/platform/native-status.tcl -verbose 1

      - name: Native objects and executables
        run: tclsh9.0 tests/platform/aot-facts.tcl -verbose 1

      - name: Smoke tier
        run: tclsh9.0 tests/platform/tier.tcl smoke

  full:
    name: full (Tier C, macOS arm64, shard ${{ matrix.shard }}/3)
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
      && (contains(github.event.head_commit.message, '[ci-full]') || inputs.tier == 'full') && !inputs.app_only
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # What this shard runs: the push's head commit message's CI-Tests and
      # CI-GC-Stress trailers, or the manual run's inputs; the acceptance
      # tier under GC stress when nothing is named. A tier is split in three
      # shards; named files and suites run in shard 1, and the other two
      # stop here.
      - name: Decide this shard's items
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_TESTS: ${{ inputs.tests }}
          INPUT_GC_STRESS: ${{ inputs.gc_stress }}
          SHARD: ${{ matrix.shard }}
        run: |
          items=""
          stress=0
          if [[ $EVENT == workflow_dispatch ]]; then
            items=$INPUT_TESTS
            [[ $INPUT_GC_STRESS == true ]] && stress=1
          else
            trailers=$(printf '%s\n' "$MESSAGE" | git interpret-trailers --parse)
            items=$(sed -n 's/^CI-Tests: *//p' <<< "$trailers" | tr '\n' ' ')
            [[ $(sed -n 's/^CI-GC-Stress: *//p' <<< "$trailers") == 1 ]] && stress=1
          fi
          items=$(echo $items)
          if [[ -z $items ]]; then
            items=acceptance
            stress=1
          fi
          shards=1
          for item in $items; do
            [[ $item == all || $item == acceptance || $item == smoke ]] && shards=3
          done
          work=true
          (( SHARD > shards )) && work=false
          {
            echo "items=$items"
            echo "stress=$stress"
            echo "shards=$shards"
            echo "work=$work"
          } >> "$GITHUB_OUTPUT"
          echo "items: $items; GC stress: $stress; shards: $shards; this shard ($SHARD) runs: $work"

      - uses: actions/checkout@v5
        if: steps.decide.outputs.work == 'true'

      - name: Install prerequisites (Tcl 9.0.1, stable Rust)
        if: steps.decide.outputs.work == 'true'
        uses: ./.github/actions/setup-macos

      - name: Build native (Cranelift) backend
        if: steps.decide.outputs.work == 'true'
        uses: ./.github/actions/build-native

      - name: Tier C items, this shard
        if: steps.decide.outputs.work == 'true'
        env:
          ITEMS: ${{ steps.decide.outputs.items }}
          STRESS: ${{ steps.decide.outputs.stress }}
          SHARDS: ${{ steps.decide.outputs.shards }}
          SHARD: ${{ matrix.shard }}
        run: |
          read -r -a items <<< "$ITEMS"
          tclsh9.0 tests/platform/tier.tcl -shard "$SHARD/$SHARDS" -gc-stress "$STRESS" "${items[@]}" 2>&1 | tee tier.log

      - name: Publish summary
        if: always() && steps.decide.outputs.work == 'true'
        env:
          ITEMS: ${{ steps.decide.outputs.items }}
          STRESS: ${{ steps.decide.outputs.stress }}
          SHARDS: ${{ steps.decide.outputs.shards }}
          SHARD: ${{ matrix.shard }}
        run: |
          {
            echo "## Full, shard $SHARD/$SHARDS: $ITEMS (GC stress: $STRESS)"
            echo '```'
            awk '/^######## .*: (ok|FAILED)/ {print} /^######## [0-9]+ commands/ {tail = 1} tail {print}' tier.log 2>/dev/null | grep -a . || echo "the tier did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && steps.decide.outputs.work == 'true'
        with:
          name: full-shard-${{ matrix.shard }}
          path: tier.log
          if-no-files-found: ignore
