name: tests (windows x86-64)

# The Windows x86-64 port's CI (WINDOWS-X86-64-MILESTONE-1.md, section 7;
# WINDOWS-X86-64-MILESTONE-2.md, section 7):
# real Windows Server 2025 runners, MSVC's toolchain -- the native driver and
# runtime built for x86_64-pc-windows-msvc, executables linked by rustc with
# Microsoft's link.exe, which rustc finds with the Windows SDK by itself (no
# step here enters a Developer Command Prompt for Botlish) -- and Tcl 9.0.1
# built from its pinned source. Production code only: nothing applies the
# census's probe patch or sets a BOTLISH_PROBE_* variable (that evidence is
# windows-probe.yml's, WINDOWS-TOOLCHAIN-CENSUS.md). Neither Wine nor WSL is
# an authority here.
#
#   smoke        every push: the host and its toolchains; the native build
#                and the Rust unit tests; core::cabi's windows-x86_64 row
#                against clang's MSVC target; the native status (each
#                capability works or is refused as recorded); program
#                objects (COFF) and executables (PE: console subsystem,
#                imports only the system's DLLs -- the C runtime linked
#                statically); C calls linked by link.exe against libraries
#                cl and lib build here, and the C runtime matrix (/MT and
#                /MD static libraries and DLLs); Windows I/O (kernel32's
#                WriteFile through the portable std::io::IO) of hello and the
#                2048 demo into files and pipes, through bash, cmd and
#                PowerShell; the allocation-heavy workloads on both native
#                backends and as executables, plainly and repeatedly under
#                GC stress; the census's pure program, URI workload and 2048
#                benchmark through main.tcl on both Cranelift backends,
#                plainly and under GC stress; the 2048 benchmark's
#                executable and MSVC's own
#                dumpbin's reading of the object and the executable; the
#                smoke tier and the Windows-relevant test files
#                (argv, targets, executables, the command line, the C FFI
#                and its Win64 ABI checks against MSVC-built fixtures,
#                Windows I/O, native coroutines and the stack guard on
#                their fibers: WINDOWS-X86-64-MILESTONE-5.md); variadic C
#                calls (WINDOWS-X86-64-MILESTONE-6.md) under GC stress:
#                the machine state against MSVC's own calls, MSVC's va_arg
#                callees, the C runtime's snprintf and _open, user32's
#                wsprintfA
#   roots        every push: the fallback root plan (a `fallback-roots`
#                driver: its Rust tests, the GC workloads) and native-frame
#                roots against it on the same runner (bench/root-plans.tcl)
#   system-linker every push: the system linker (SINGLE-EXECUTABLE-FFI-
#                MILESTONE-1.md) -- link.exe from a Developer environment,
#                the precompiled runtime archive, no rustc -- its tests and
#                the executable and C test files linked by it, plainly and
#                under GC stress
#   acceptance   every push, four shards: tests/platform/tier.tcl's
#                acceptance tier -- every Tcl test file on interp and every
#                golden suite on all four backends (the golden runner is a
#                coroutine, which the native backends run on Windows since
#                WINDOWS-X86-64-MILESTONE-5.md) -- minus the files its notYet
#                table lists for windows-x86_64, each with its cause
#   full         opt-in: "[ci-full]" in the pushed head commit's message, or
#                a manual run with tier "full": the acceptance tier under
#                BOTLISH_NATIVE_GC_STRESS=1 in four shards, or exactly the
#                tier.tcl items a "CI-Tests:" trailer (or the "tests"
#                input) names, under GC stress only with "CI-GC-Stress: 1"
#                (or the "gc_stress" input)
#
# Pushes to any branch run it, so a branch gets Windows results before this
# file is on main; a pull request from this repository's own branches skips
# (its push already ran), one from a fork runs. Documentation-only pushes
# skip. A newer push to the same branch cancels a running one, except on
# main. The checkout keeps the repository's bytes (no CRLF conversion).

on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      tier:
        description: "acceptance: the ordinary jobs; full: also the GC-stress tier"
        type: choice
        options: [acceptance, full]
        default: acceptance
      tests:
        description: "the full tier's items instead of its default payload (tests/platform/tier.tcl items, space-separated)"
        required: false
        default: ""
      gc_stress:
        description: "Run the named items under BOTLISH_NATIVE_GC_STRESS=1"
        type: boolean
        default: false
      probes:
        description: "The roots job's probes (audit/windows-unwind): explicit frame anchors' per-call cost"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-x86_64-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The C compiler of core::cabi's windows-x86_64 row, for every job: clang,
# whose default target on Windows is MSVC's. The image's `cc` is a MinGW gcc,
# windows-x86_64-gnu's toolchain, which cabi-facts.tcl refuses for this row,
# as it should.
env:
  CC: clang

defaults:
  run:
    # Git for Windows' bash, -eo pipefail (a failure piped through tee
    # fails the step).
    shell: bash

jobs:
  smoke:
    name: smoke (Windows x86-64, MSVC)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Keep the repository's bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Host
        shell: pwsh
        run: |
          [System.Environment]::OSVersion
          "processor: $env:PROCESSOR_ARCHITECTURE, $env:NUMBER_OF_PROCESSORS CPUs"
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") { throw "not an x86-64 Windows runner: $env:PROCESSOR_ARCHITECTURE" }
          # Only Git's coreutils link.exe may be on PATH: Microsoft's is
          # found by rustc itself, never through a Developer Command Prompt.
          Get-Command link.exe -All -ErrorAction SilentlyContinue | Select-Object Source

      - name: Install prerequisites (Tcl 9.0.1, stable Rust for x86_64-pc-windows-msvc)
        uses: ./.github/actions/setup-windows

      - name: Versions
        run: |
          rustc -vV
          cargo -V
          echo 'puts "Tcl [info patchlevel], hostTarget: [source core/core.tcl; core::cabi::hostTarget]"' | tclsh9.0
          clang --version | head -2

      - name: Build native (Cranelift) backend
        id: build
        uses: ./.github/actions/build-native

      # Every check below runs once the backend is built, whatever an earlier
      # one found, so that one failure never hides the others.

      # The runtime's tests and the driver's own (--bins): the link plans
      # (MSVC's among them), targets, stack probes, the program object's
      # format, the argument encoding.
      # Then the single-step unwind test again, for its own account (how many
      # instructions it unwound, the frames it probed), and the coroutine
      # fiber's commit test, for what a fiber commits
      # (WINDOWS-X86-64-MILESTONE-5.md, "Performance"): a passing test's
      # output is otherwise not shown.
      - name: Native Rust unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cargo test --release --manifest-path native/Cargo.toml --lib --bins --no-fail-fast 2>&1 | tee rust-tests.log
          cargo test --release --manifest-path native/Cargo.toml --bins windows_unwinds_every_instruction_of_jit_code -- --nocapture 2>&1 | grep -a '^windows_unwinds_every_instruction_of_jit_code:' | tee -a rust-tests.log
          cargo test --release --manifest-path native/Cargo.toml --lib a_fresh_fiber_commits_its_guarantee_and_a_page -- --nocapture 2>&1 | grep -a '^a_fresh_fiber_commits_its_guarantee_and_a_page:' | tee -a rust-tests.log

      # The stack-overflow guard (WINDOWS-X86-64-MILESTONE-4.md,
      # native/tests/native_stack/windows.rs): each kind of thread's stack and
      # its guard page; the guard on it, the stack exhausted for real -- small
      # frames, 64 KiB frames, Cranelift's probe pattern -- in the driver's,
      # an executable's and the result file's modes; the faults that are not
      # the guarded stack's overflow, each ending as it does without the
      # guard. And coroutine stacks, fibers (WINDOWS-X86-64-MILESTONE-5.md):
      # each exhausted at its start, after yields and nested three deep; the
      # stack published to the guard at every switch of a nested lifecycle;
      # the faults on and around them that are not an overflow; a switch at
      # every offset near the end of the stack it leaves. Every check that
      # faults runs in a child process.
      - name: Native stack guard checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --release --manifest-path native/Cargo.toml --test native_stack 2>&1 | tee native-stack.log

      - name: C ABI facts against core::cabi's windows-x86_64 row (clang, MSVC target)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tclsh9.0 tests/platform/cabi-facts.tcl

      # Each native capability works or is refused exactly as recorded for
      # windows-x86_64 (tests/platform/native-status.tcl): the JIT, GC
      # stress, objects, executables, the target boundary (another
      # operating system, the other Windows environment), C calls and byte
      # exposure to the C library, Windows I/O, variadic C calls (through
      # Win64's stub, WINDOWS-X86-64-MILESTONE-6.md), coroutines, the stack
      # guard.
      - name: Native status
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tclsh9.0 tests/platform/native-status.tcl -verbose 1 2>&1 | tee native-status.log

      # The COFF object and the PE executable, read here (no MSVC tool):
      # symbols, relocations, subsystem, imported DLLs (the system's only),
      # the standalone runs; then C calls with MSVC's cl and lib (the
      # tests' C toolchain, tests/ctoolchain.tcl: vcvars64.bat's
      # environment for those tools alone) -- link.exe's command line and
      # its own words for a missing library and an undefined symbol -- and
      # the C runtime matrix.
      - name: Native objects and executables
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tclsh9.0 tests/platform/aot-facts.tcl -verbose 1 2>&1 | tee aot-facts.log

      # The census's allocation-heavy workloads and more, on both native
      # backends and as executables, five times under GC stress -- the
      # coroutine workloads among them, every coroutine on a fiber of its
      # own (fusion off): suspended stacks holding the only roots of values
      # while other coroutines collect.
      - name: GC workloads (cranelift, cranelift-generic, executables; GC stress)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tclsh9.0 tests/platform/gc-workloads.tcl -repeat 5 2>&1 | tee gc-workloads.log

      # The same workloads with Windows' own unwinder checking the collector
      # (WINDOWS-X86-64-MILESTONE-3.md): BOTLISH_NATIVE_UNWIND_CHECK=1 -- every
      # Botlish function's unwind entry (the JIT's function table, the
      # executable's .pdata) spans exactly its code, and every Botlish frame
      # of every collection unwinds by it as by its frame record.
      - name: GC workloads under Windows' unwind check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tclsh9.0 tests/platform/gc-workloads.tcl -repeat 2 -unwind-check 1 2>&1 | tee gc-workloads-unwind.log

      # The census's three programs (its pure program, the URI workload and
      # the 2048 benchmark) through main.tcl itself, on both Cranelift
      # backends, as ordinary runs, under GC stress, and under GC stress with
      # Windows' unwind check.
      - name: The census's programs through main.tcl (cranelift, cranelift-generic; GC stress, unwind check)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          while IFS='|' read -r file expected; do
            for backend in cranelift cranelift-generic; do
              for mode in 0 1 check; do
                stress=$([ "$mode" = 0 ] && echo 0 || echo 1)
                check=$([ "$mode" = check ] && echo 1 || echo 0)
                out=$(BOTLISH_NATIVE_GC_STRESS=$stress BOTLISH_NATIVE_UNWIND_CHECK=$check tclsh9.0 main.tcl -warnings off -backend $backend "$file" 2>&1 | tr -d '\r') || true
                value=$(printf '%s\n' "$out" | sed -n 's/^   value: //p')
                if [ "$value" = "$expected" ]; then verdict=ok; else verdict=FAIL; failed=1; fi
                echo "$verdict $file -backend $backend, GC stress $stress, unwind check $check: $value"
                [ "$verdict" = ok ] || printf '%s\n' "$out"
              done
            done
          done <<'EOF'
          audit/windows-toolchain/programs/fib.bot|[75025, "hello", 18446744073709551614]
          bench/uri-steady.bot|29500
          examples/games/2048/bench.bot|2002720
          EOF
          exit $failed

      - name: The 2048 benchmark as an executable
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          cp examples/games/2048/bench.bot examples/games/2048/game2048.bot audit/windows-toolchain/programs/fib.bot artifacts/
          tclsh9.0 main.tcl -warnings off -emit-native-executable artifacts/bench.bot artifacts/fib.bot | tee artifacts/emit.txt
          grep -qx 'executable: artifacts/bench.exe' artifacts/emit.txt
          echo 'source native/native.tcl; native::object [surface::readProgramFile artifacts/fib.bot -warnings off] artifacts/fib.obj' | tclsh9.0
          value=$(artifacts/fib.exe)
          echo "fib.exe: $value"
          test "$value" = '[75025, "hello", 18446744073709551614]'
          value=$(artifacts/bench.exe)
          echo "bench.exe: $value"
          test "$value" = 2002720
          value=$(BOTLISH_NATIVE_GC_STRESS=1 artifacts/bench.exe)
          echo "bench.exe under GC stress: $value"
          test "$value" = 2002720
          value=$(BOTLISH_NATIVE_GC_STRESS=1 BOTLISH_NATIVE_UNWIND_CHECK=1 artifacts/bench.exe 2> artifacts/unwind-check.txt)
          echo "bench.exe under GC stress, unwind check: $value; $(cat artifacts/unwind-check.txt)"
          test "$value" = 2002720
          grep -qE '^native unwind check: [1-9][0-9]* functions, [1-9][0-9]* Botlish frames' artifacts/unwind-check.txt
          # A program object of variadic C calls (WINDOWS-X86-64-MILESTONE-6.md),
          # for the next step's dumpbin /disasm: integers only (a direct
          # call), one double (its stub copies xmm1 into rdx), doubles and
          # ints alternating past the four registers, and a fixed-arity call
          # with doubles (direct). Nothing links or runs it.
          cat > artifacts/variadic.bot <<'EOF'
          import std::ffi::c

          extern c fn probe named "botlish_variadic_probe"(n: std::ffi::c::Int, variadic) -> std::ffi::c::Int
          extern c fn fixed named "botlish_fixed_probe"(x: std::ffi::c::Double, n: std::ffi::c::Int, y: std::ffi::c::Double) -> std::ffi::c::Int

          fn c_int(x: std::ffi::c::Int) -> std::ffi::c::Int:
              x

          fn ints(a: std::ffi::c::Int) -> std::ffi::c::Int:
              probe(3, a, a, a)

          fn one(x: Float64) -> std::ffi::c::Int:
              probe(1, x)

          fn mixed(a: std::ffi::c::Int, x: Float64) -> std::ffi::c::Int:
              probe(7, x, a, x, a, x, a, x)

          fn fixed_doubles(a: std::ffi::c::Int, x: Float64) -> std::ffi::c::Int:
              fixed(x, a, x)

          [ints(c_int(1)), one(0.5), mixed(c_int(2), 1.5), fixed_doubles(c_int(3), 2.5)]
          EOF
          echo 'source native/native.tcl; native::object [surface::readProgramFile artifacts/variadic.bot -warnings off] artifacts/variadic.obj' | tclsh9.0
          echo 'source native/native.tcl; puts [native::clif [surface::readProgramFile artifacts/variadic.bot -warnings off]]' | tclsh9.0 > artifacts/variadic.clif
          grep -E '^; u0:[0-9]+ = botlish_va_' artifacts/variadic.clif

      # Windows I/O as a user meets it (WINDOWS-X86-64-MILESTONE-2.md,
      # section 5): hello-windows.bot and the 2048 demo as executables,
      # their standard output a file, a pipe and (for stderr) its own file,
      # redirected by bash, cmd and PowerShell -- the bytes exactly the
      # program's (UTF-8, LF, no code page applied), byte-compared with the
      # Linux demo's expected game. A runner's output is never a console:
      # what a console shows is the console's, not checked here.
      - name: Windows I/O (hello, the 2048 demo; files and pipes through bash, cmd and PowerShell)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p wio
          cp examples/io/hello-windows.bot wio/hello.bot
          cp examples/games/2048/demo-windows.bot examples/games/2048/demo_play.bot examples/games/2048/game2048.bot wio/
          tclsh9.0 main.tcl -warnings off -emit-native-executable wio/hello.bot wio/demo-windows.bot
          printf 'Hello, world!\nunit\n' > wio/hello.expected
          ./wio/hello.exe > wio/hello.file 2> wio/hello.err
          cmp wio/hello.file wio/hello.expected
          test ! -s wio/hello.err
          ./wio/hello.exe | cat > wio/hello.pipe
          cmp wio/hello.pipe wio/hello.expected
          cmd //c 'wio\hello.exe > wio\hello.cmd 2>&1'
          cmp wio/hello.cmd wio/hello.expected
          pwsh -NoProfile -Command '$p = Start-Process -FilePath .\wio\hello.exe -NoNewWindow -Wait -PassThru -RedirectStandardOutput wio\hello.pwsh -RedirectStandardError wio\hello.pwsh-err; exit $p.ExitCode'
          cmp wio/hello.pwsh wio/hello.expected
          ./wio/demo-windows.exe > wio/demo.file
          BOTLISH_NATIVE_GC_STRESS=1 ./wio/demo-windows.exe | cat > wio/demo.pipe
          cmp wio/demo.file wio/demo.pipe
          tclsh9.0 tests/workload-2048.test -match 'workload-2048-demo-windows-*' 2>&1 | tee wio/demo-test.log
          grep -q 'Failed	0' wio/demo-test.log
          grep -q 'Passed	1' wio/demo-test.log
          echo "hello: $(od -An -c wio/hello.file | tr -s ' ')"
          echo "demo: $(wc -c < wio/demo.file) bytes, $(grep -c . wio/demo.file) lines"

      # A second opinion on the files tests/binary-header.tcl reads: MSVC's
      # own dumpbin (the only step that enters vcvars64.bat).
      - name: dumpbin (MSVC) on the object and the executables
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" >nul || exit /b 1
          dumpbin /nologo /headers artifacts\fib.obj | findstr /i "machine sections" || exit /b 1
          dumpbin /nologo /symbols artifacts\fib.obj | findstr /i "botlish_fn_ rt_list_new" || exit /b 1
          dumpbin /nologo /relocations artifacts\fib.obj | findstr /i "REL32" || exit /b 1
          dumpbin /nologo /dependents artifacts\bench.exe || exit /b 1
          dumpbin /nologo /dependents artifacts\bench.exe | findstr /i "vcruntime ucrtbase api-ms-win-crt" && (echo bench.exe imports the C runtime & exit /b 1)
          dumpbin /nologo /headers artifacts\bench.exe | findstr /i "subsystem machine" || exit /b 1
          rem Windows unwind information (WINDOWS-X86-64-MILESTONE-3.md): the
          rem object's function table (an object's entries are relocations:
          rem dumpbin lists them undecoded), the executables' exception
          rem directories, and fib.exe's every entry decoded (the next step
          rem picks out the Botlish functions' by their names in its PDB).
          dumpbin /nologo /unwindinfo artifacts\fib.obj > artifacts\fib-obj-unwind.txt || exit /b 1
          type artifacts\fib-obj-unwind.txt
          findstr /c:"Function Table" artifacts\fib-obj-unwind.txt || exit /b 1
          dumpbin /nologo /headers artifacts\fib.exe | findstr /i /c:"Exception Directory" || exit /b 1
          dumpbin /nologo /unwindinfo artifacts\fib.exe > artifacts\fib-unwind.txt || exit /b 1
          dumpbin /nologo /headers artifacts\bench.exe | findstr /i /c:"Exception Directory" || exit /b 1
          dumpbin /nologo /unwindinfo artifacts\bench.exe > artifacts\bench-unwind.txt || exit /b 1
          findstr /i /c:"Function Table" artifacts\bench-unwind.txt || exit /b 1
          rem Variadic C calls' machine code (WINDOWS-X86-64-MILESTONE-6.md):
          rem the callers and the stubs, as MSVC's disassembler reads them.
          dumpbin /nologo /disasm /symbols artifacts\variadic.obj > artifacts\variadic-disasm.txt || exit /b 1
          findstr /c:"botlish_va_" artifacts\variadic-disasm.txt || exit /b 1
          exit /b 0

      # dumpbin's decoding of each Botlish function's UNWIND_INFO in fib.exe.
      # An image's listing names no function: the Botlish entries are the
      # one run of entries matching the object's own table (sizes, and
      # distances between their UNWIND_INFO), each the frame codegen::unwind
      # describes (audit/windows-unwind/tools/dumpbin-entries.tcl).
      - name: dumpbin's decoding of the Botlish functions' unwind information
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          tclsh9.0 audit/windows-unwind/tools/dumpbin-entries.tcl artifacts/fib-obj-unwind.txt artifacts/fib-unwind.txt artifacts/fib-botlish-unwind.txt | tee artifacts/fib-botlish-found.txt
          cat artifacts/fib-botlish-unwind.txt

      # The smoke tier (examples on all four backends, front-end files) and
      # the test files the port changes most: argv (the Windows argument
      # tests, linked runs among them), targets, executables, the command
      # line, applications, the 2048 workload, the C FFI (the Win64 ABI
      # against MSVC-built fixtures), byte exposure, C floats, Windows I/O,
      # native coroutines (fused and on the general runtime, their stacks'
      # exhaustion, C recursion on a coroutine stack among c-ffi.test's) and
      # the coroutine golden suite on all four backends.
      - name: Smoke tier and the Windows-relevant test files
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          tclsh9.0 tests/platform/tier.tcl smoke argv.test target-model.test native-executable.test \
            main-cli.test application-modules.test workload-2048.test native.test c-abi-types.test \
            c-ffi.test windows-io.test c-byte-borrowing.test c-float-ffi.test \
            coroutines.test coroutine-fusion.test native-stack-overflow.test coroutines.bot 2>&1 | tee tier.log

      # Variadic C calls (WINDOWS-X86-64-MILESTONE-6.md) once more, every
      # one under GC stress: the machine state each arrives in against
      # MSVC's own variadic call of the same prototype (a double of the first
      # four positions in both of its position's registers), MSVC-built
      # va_arg callees, the static C runtime's snprintf and _open, user32's
      # wsprintfA, in executables and coroutines.
      - name: Variadic C calls under GC stress
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p variadic-tmp
          BOTLISH_NATIVE_GC_STRESS=1 tclsh9.0 tests/c-ffi.test -match 'cf-va-*' -tmpdir "$(pwd -W)/variadic-tmp" 2>&1 | tee variadic-gc.log
          grep -aq 'Failed	0' variadic-gc.log
          ! grep -aq 'Passed	0' variadic-gc.log

      - name: Publish summary
        if: always()
        run: |
          set +e  # a check that finds nothing must not end the summary
          {
            echo "## Smoke (Windows x86-64, MSVC)"
            # Failures first, in their own words (the annotations' first
            # parts), then the listings, then every check's line.
            if [ -f rust-tests.log ] && grep -aq 'test result: FAILED\|^error' rust-tests.log; then
              echo '### Rust unit test failures'
              echo '```'
              awk '/^failures:$/ {on = 1} on {print} /^test result/ {on = 0}' rust-tests.log | head -n 300
              grep -a -A12 '^error' rust-tests.log | head -n 100
              echo '```'
            fi
            for log in native-stack.log native-status.log aot-facts.log gc-workloads.log gc-workloads-unwind.log; do
              if [ -f "$log" ] && grep -aqE '^(FAIL|FAILED)' "$log"; then
                echo "### $log"
                echo '```'
                grep -a -A25 -E '^(FAIL|FAILED)' "$log" | head -n 200
                echo '```'
              fi
            done
            if grep -aq '^==== .*FAILED' tier.log 2>/dev/null; then
              echo '### Failed tests'
              echo '```'
              awk '/^==== [^ ]+ FAILED$/ {print; on = 0; next} /^==== .* FAILED$/ {on = 1} on {print}' tier.log | head -n 400
              echo '```'
            fi
            if grep -aq '^==== .*FAILED' variadic-gc.log 2>/dev/null; then
              echo '### Failed variadic tests (GC stress)'
              echo '```'
              awk '/^==== [^ ]+ FAILED$/ {print; on = 0; next} /^==== .* FAILED$/ {on = 1} on {print}' variadic-gc.log | head -n 300
              echo '```'
            fi
            for listing in artifacts/unwind-check.txt artifacts/fib-botlish-found.txt artifacts/fib-botlish-unwind.txt artifacts/fib-obj-unwind.txt artifacts/fib-unwind.txt; do
              if [ -f "$listing" ]; then
                echo "### $listing"
                echo '```'
                tr -d '\r' < "$listing" | head -n 60
                echo '```'
              fi
            done
            if [ -f artifacts/variadic-disasm.txt ]; then
              echo "### artifacts/variadic-disasm.txt (variadic C calls, dumpbin /disasm)"
              echo '```'
              tr -d '\r' < artifacts/variadic-disasm.txt | head -n 220
              echo '```'
            fi
            echo '### Checks'
            echo '```'
            for log in native-stack.log native-status.log aot-facts.log; do
              [ -f "$log" ] && grep -aE '^(ok|FAIL)' "$log"
            done
            [ -f gc-workloads.log ] && tail -n 1 gc-workloads.log
            [ -f gc-workloads-unwind.log ] && sed -n '1p;$p' gc-workloads-unwind.log
            [ -f gc-workloads-unwind.log ] && grep -a 'native unwind check' gc-workloads-unwind.log | head -n 30
            awk '/^######## .*: (ok|FAILED)/ {print} /^######## [0-9]+ commands/ {tail = 1} tail {print}' tier.log 2>/dev/null | grep -a . || echo "the smoke tier did not run"
            [ -f variadic-gc.log ] && grep -a '^c-ffi.test:' variadic-gc.log | sed 's/^/variadic C calls under GC stress: /'
            echo '```'
            # The Rust tests of this milestone's Windows paths, by name: the
            # evidence that they ran here (WINDOWS-X86-64-MILESTONE-3.md).
            if [ -f rust-tests.log ]; then
              echo '### Rust tests'
              echo '```'
              grep -a 'test result' rust-tests.log
              grep -aE '^test (codegen::jitunwind|codegen::unwind|codegen::caller_root|codegen::object_format|codegen::clif::win64_variadic_tests|runtime::coroutine|runtime::framewalk|runtime::native_stack|runtime::platform)' rust-tests.log
              grep -a '^windows_unwinds_every_instruction_of_jit_code:' rust-tests.log
              grep -a '^a_fresh_fiber_commits_its_guarantee_and_a_page:' rust-tests.log
              echo '```'
            fi
          } > smoke-summary.md
          cat smoke-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate with the summary
        if: always()
        uses: ./.github/actions/annotate
        with:
          file: smoke-summary.md
          title: smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: |
            *.log
            artifacts
          if-no-files-found: ignore

  # The two root plans on one Windows runner (WINDOWS-X86-64-MILESTONE-3.md,
  # sections 6 and 8): the fallback plan -- the shadow stack, the bootstrap
  # of a host without native-frame roots -- built from this checkout with the
  # `fallback-roots` feature, its Rust tests and the GC workloads on it; then
  # bench/root-plans.tcl, native-frame roots against it with the same
  # compiler and the same NIR: the JIT and executables, GC stress's cost per
  # collection, code and unwind information sizes.
  roots:
    name: root plans (Windows x86-64, native frames and the fallback)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Keep the repository's bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Install prerequisites (Tcl 9.0.1, stable Rust for x86_64-pc-windows-msvc)
        uses: ./.github/actions/setup-windows

      - name: Build native (Cranelift) backend
        id: build
        uses: ./.github/actions/build-native

      - name: Cache the fallback-roots build
        uses: actions/cache@v4
        with:
          path: native/target-fallback
          key: native-fallback-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: native-fallback-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the fallback-roots driver
        id: fallback
        run: cargo build --release --manifest-path native/Cargo.toml --features fallback-roots --target-dir native/target-fallback

      - name: The fallback plan's Rust tests
        if: ${{ !cancelled() && steps.fallback.outcome == 'success' }}
        run: cargo test --release --manifest-path native/Cargo.toml --features fallback-roots --target-dir native/target-fallback --lib --bins --no-fail-fast 2>&1 | tee fallback-rust-tests.log

      - name: GC workloads on the fallback plan
        if: ${{ !cancelled() && steps.fallback.outcome == 'success' }}
        env:
          BOTLISH_NATIVE_BIN: native/target-fallback/release/botlish-native.exe
        run: tclsh9.0 tests/platform/gc-workloads.tcl -repeat 3 2>&1 | tee fallback-gc-workloads.log

      - name: Native-frame roots against the fallback plan
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fallback.outcome == 'success' }}
        run: tclsh9.0 bench/root-plans.tcl -fallback native/target-fallback/release/botlish-native.exe -runs 20 -rounds 7 -stress-runs 3 2>&1 | tee root-plans.log

      # What coroutines cost on Windows (WINDOWS-X86-64-MILESTONE-5.md,
      # "Performance"): the general runtime's operations natively -- a fiber
      # per coroutine, fusion off (bench/coroutines.tcl) -- and the declared
      # recognizers' workloads, fused and on the general runtime
      # (bench/dfa.tcl).
      - name: Coroutine costs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          tclsh9.0 bench/coroutines.tcl -backends native -runs 5 2>&1 | tee coroutine-costs.log
          tclsh9.0 bench/dfa.tcl -runs 3 -rounds 3 2>&1 | tee dfa-costs.log

      # Programs without coroutines before and after the coroutine milestone
      # (WINDOWS-X86-64-MILESTONE-5.md): the driver of main before it built
      # here, against this checkout's, on bench/root-plans.tcl's workloads.
      # On demand, with the other probes.
      - name: "Probe: programs without coroutines, before and after native coroutines"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (contains(github.event.head_commit.message, '[ci-probes]') || inputs.probes) }}
        run: |
          git fetch --quiet --depth 1 origin b5b17a398698931f3e7172bdd379174f7cbb6b4d
          git worktree add --quiet --detach "$RUNNER_TEMP/before-coroutines" FETCH_HEAD
          cargo build --release --manifest-path "$RUNNER_TEMP/before-coroutines/native/Cargo.toml" --target-dir native/target-before-coroutines
          tclsh9.0 bench/root-plans.tcl -fallback native/target-before-coroutines/release/botlish-native.exe -name before-coroutines -runs 20 -rounds 7 -stress-runs 1 2>&1 | tee before-coroutines.log

      # Strategy B's per-call cost, measured (WINDOWS-X86-64-MILESTONE-3.md,
      # section 3): a driver built with audit/windows-unwind/tools/anchors.patch
      # stores the stack pointer to the Vm before every runtime call at a GC
      # safepoint -- the explicit frame anchor that design's collector would
      # start from -- which nothing reads, against the production driver. On
      # demand: "[ci-probes]" in the head commit, or a manual run with probes.
      - name: "Probe: explicit frame anchors' per-call cost (strategy B)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (contains(github.event.head_commit.message, '[ci-probes]') || inputs.probes) }}
        run: |
          git apply audit/windows-unwind/tools/anchors.patch
          cargo build --release --manifest-path native/Cargo.toml --target-dir native/target-anchors
          git apply -R audit/windows-unwind/tools/anchors.patch
          tclsh9.0 bench/root-plans.tcl -fallback native/target-anchors/release/botlish-native.exe -name anchors -runs 20 -rounds 7 -stress-runs 1 2>&1 | tee anchors.log

      # The stack guard against the interim checks it replaced
      # (WINDOWS-X86-64-MILESTONE-4.md, sections 1 and 8): the driver of the
      # last revision before it -- every function with a Botlish call
      # checking its stack pointer, every such call checked for the error,
      # no guard -- built here, against this checkout's, which has the guard
      # and neither check: what each does with an exhausted stack
      # (audit/windows-stack-guard/tools/before-after.tcl), then their
      # performance (bench/root-plans.tcl). On demand, with the anchors
      # probe: "[ci-probes]" in the head commit, or a manual run with probes.
      - name: "Probe: the interim stack-limit checks' cost"
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (contains(github.event.head_commit.message, '[ci-probes]') || inputs.probes) }}
        run: |
          git fetch --quiet --depth 1 origin 85753d95992f4c262e6556d914d1cde634a0add0
          git worktree add --quiet --detach "$RUNNER_TEMP/checks" FETCH_HEAD
          cargo build --release --manifest-path "$RUNNER_TEMP/checks/native/Cargo.toml" --target-dir native/target-checks
          tclsh9.0 audit/windows-stack-guard/tools/before-after.tcl before=native/target-checks/release/botlish-native.exe after=native/target/release/botlish-native.exe fallback=native/target-fallback/release/botlish-native.exe 2>&1 | tee before-after.log
          tclsh9.0 bench/root-plans.tcl -fallback native/target-checks/release/botlish-native.exe -name checks -runs 20 -rounds 7 -stress-runs 1 2>&1 | tee checks.log

      - name: Publish summary
        if: always()
        run: |
          set +e  # a check that finds nothing must not end the summary
          {
            echo "## Root plans (Windows x86-64)"
            echo '```'
            [ -f fallback-rust-tests.log ] && grep -a 'test result' fallback-rust-tests.log
            [ -f fallback-gc-workloads.log ] && sed -n '1p;$p' fallback-gc-workloads.log
            [ -f fallback-gc-workloads.log ] && grep -a '^FAILED' fallback-gc-workloads.log
            [ -f root-plans.log ] && cat root-plans.log
            [ -f anchors.log ] && cat anchors.log
            [ -f before-after.log ] && cat before-after.log
            [ -f checks.log ] && cat checks.log
            [ -f before-coroutines.log ] && cat before-coroutines.log
            [ -f coroutine-costs.log ] && cat coroutine-costs.log
            [ -f dfa-costs.log ] && cat dfa-costs.log
            echo '```'
            if [ -f fallback-rust-tests.log ] && grep -aq 'test result: FAILED' fallback-rust-tests.log; then
              echo '```'
              awk '/^failures:$/ {on = 1} on {print} /^test result/ {on = 0}' fallback-rust-tests.log | head -n 200
              echo '```'
            fi
          } > roots-summary.md
          cat roots-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate with the summary
        if: always()
        uses: ./.github/actions/annotate
        with:
          file: roots-summary.md
          title: roots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-root-plans
          path: "*.log"
          if-no-files-found: ignore

  # The system linker on Windows (SINGLE-EXECUTABLE-FFI-MILESTONE-1.md):
  # executables linked by Microsoft's link.exe directly -- no rustc -- from
  # the program object and the precompiled runtime archive
  # (botlish_runtime.lib), with the static release C runtime and
  # every other one excluded, as the rustc linker's. Unlike rustc, the system
  # linker finds no Visual Studio itself: it runs the link.exe a Developer
  # environment puts on PATH, which these steps enter (vcvars64.bat).
  system-linker:
    name: system linker (Windows x86-64, MSVC)
    needs: smoke
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Keep the repository's bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Install prerequisites (Tcl 9.0.1, stable Rust for x86_64-pc-windows-msvc)
        uses: ./.github/actions/setup-windows

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - name: The system linker's tests, in a Developer environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2]) }
          }
          $ErrorActionPreference = "Continue"
          $failed = 0
          native/target/release/botlish-native.exe system-linker
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          # The libraries the driver passes after the runtime archive,
          # against rustc's account of them (codegen/aot.rs's
          # runtime_system_libraries).
          tclsh9.0 native/runtime-archive/libraries.tcl
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          # A system-linked executable: the link command (BOTLISH_NATIVE_LINK_LOG),
          # its run and what it imports.
          $env:BOTLISH_NATIVE_LINKER = "system"
          $env:BOTLISH_NATIVE_LINK_LOG = "$PWD\link.log"
          New-Item -ItemType Directory -Force -Path sl | Out-Null
          Copy-Item examples/io/hello-windows.bot sl/
          tclsh9.0 main.tcl -warnings off -emit-native-executable sl/hello-windows.bot
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          Get-Content link.log
          sl/hello-windows.exe
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          dumpbin /nologo /dependents sl/hello-windows.exe
          Remove-Item env:BOTLISH_NATIVE_LINK_LOG
          tclsh9.0 tests/all.tcl -file system-linker.test
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          tclsh9.0 tests/all.tcl -file "c-ffi.test windows-io.test argv.test native-executable.test c-float-ffi.test workload-2048.test"
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          $env:BOTLISH_NATIVE_GC_STRESS = "1"
          tclsh9.0 tests/all.tcl -file "system-linker.test c-ffi.test"
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          exit $failed

  acceptance:
    name: acceptance (Windows x86-64, shard ${{ matrix.shard }}/4)
    # After the smoke job, whatever its result: Windows runners are few, and
    # the smoke's verdict is the one wanted first.
    needs: smoke
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: windows-2025
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Keep the repository's bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Install prerequisites (Tcl 9.0.1, stable Rust for x86_64-pc-windows-msvc)
        uses: ./.github/actions/setup-windows

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - name: Acceptance tier, this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: tclsh9.0 tests/platform/tier.tcl -shard "$SHARD/4" -backends interp acceptance 2>&1 | tee tier.log

      - name: Publish summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set +e  # a check that finds nothing must not end the summary
          {
            echo "## Acceptance (Windows x86-64), shard $SHARD/4"
            echo '```'
            awk '/^######## .*: (ok|FAILED)/ {print} /^######## [0-9]+ commands/ {tail = 1} tail {print}' tier.log 2>/dev/null | grep -a . || echo "the acceptance tier did not run"
            echo '```'
            if grep -aq '^==== .*FAILED' tier.log 2>/dev/null; then
              echo '### Failed tests'
              echo '```'
              awk '/^==== [^ ]+ FAILED$/ {print; on = 0; next} /^==== .* FAILED$/ {on = 1} on {print}' tier.log | head -n 400
              echo '```'
            fi
          } > acceptance-summary.md
          cat acceptance-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate with the summary
        if: always()
        uses: ./.github/actions/annotate
        with:
          file: acceptance-summary.md
          title: acceptance ${{ matrix.shard }}/4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-acceptance-shard-${{ matrix.shard }}
          path: tier.log
          if-no-files-found: ignore

  full:
    name: full (Windows x86-64, shard ${{ matrix.shard }}/4)
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
      && (contains(github.event.head_commit.message, '[ci-full]') || inputs.tier == 'full')
    runs-on: windows-2025
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # What this shard runs, as macos-arm64.yml's full tier decides it.
      - name: Decide this shard's items
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_TESTS: ${{ inputs.tests }}
          INPUT_GC_STRESS: ${{ inputs.gc_stress }}
          SHARD: ${{ matrix.shard }}
        run: |
          items=""
          stress=0
          if [[ $EVENT == workflow_dispatch ]]; then
            items=$INPUT_TESTS
            [[ $INPUT_GC_STRESS == true ]] && stress=1
          else
            trailers=$(printf '%s\n' "$MESSAGE" | git interpret-trailers --parse)
            items=$(sed -n 's/^CI-Tests: *//p' <<< "$trailers" | tr '\n' ' ')
            [[ $(sed -n 's/^CI-GC-Stress: *//p' <<< "$trailers") == 1 ]] && stress=1
          fi
          items=$(echo $items)
          if [[ -z $items ]]; then
            items=acceptance
            stress=1
          fi
          shards=1
          for item in $items; do
            [[ $item == all || $item == acceptance || $item == smoke ]] && shards=4
          done
          work=true
          (( SHARD > shards )) && work=false
          {
            echo "items=$items"
            echo "stress=$stress"
            echo "shards=$shards"
            echo "work=$work"
          } >> "$GITHUB_OUTPUT"
          echo "items: $items; GC stress: $stress; shards: $shards; this shard ($SHARD) runs: $work"

      - name: Keep the repository's bytes
        if: steps.decide.outputs.work == 'true'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        if: steps.decide.outputs.work == 'true'

      - name: Install prerequisites (Tcl 9.0.1, stable Rust for x86_64-pc-windows-msvc)
        if: steps.decide.outputs.work == 'true'
        uses: ./.github/actions/setup-windows

      - name: Build native (Cranelift) backend
        if: steps.decide.outputs.work == 'true'
        uses: ./.github/actions/build-native

      - name: Full tier items, this shard
        if: steps.decide.outputs.work == 'true'
        env:
          ITEMS: ${{ steps.decide.outputs.items }}
          STRESS: ${{ steps.decide.outputs.stress }}
          SHARDS: ${{ steps.decide.outputs.shards }}
          SHARD: ${{ matrix.shard }}
        run: |
          read -r -a items <<< "$ITEMS"
          tclsh9.0 tests/platform/tier.tcl -shard "$SHARD/$SHARDS" -gc-stress "$STRESS" "${items[@]}" 2>&1 | tee tier.log

      - name: Publish summary
        if: always() && steps.decide.outputs.work == 'true'
        env:
          ITEMS: ${{ steps.decide.outputs.items }}
          STRESS: ${{ steps.decide.outputs.stress }}
          SHARDS: ${{ steps.decide.outputs.shards }}
          SHARD: ${{ matrix.shard }}
        run: |
          set +e  # a check that finds nothing must not end the summary
          {
            echo "## Full, shard $SHARD/$SHARDS: $ITEMS (GC stress: $STRESS)"
            echo '```'
            awk '/^######## .*: (ok|FAILED)/ {print} /^######## [0-9]+ commands/ {tail = 1} tail {print}' tier.log 2>/dev/null | grep -a . || echo "the tier did not run"
            echo '```'
            # A mutation tool's own report: each mutant's verdict and what
            # killed it, or why it did not build.
            if grep -aqE '^(KILLED|SURVIVED|NOT-BUILT|NOT-APPLIED|SKIPPED) ' tier.log 2>/dev/null; then
              echo '### Mutants'
              echo '```'
              grep -aE '^(KILLED|SURVIVED|NOT-BUILT|NOT-APPLIED|SKIPPED) |^    |^[0-9]+ mutants on ' tier.log | head -n 300
              echo '```'
            fi
            if grep -aq '^==== .*FAILED' tier.log 2>/dev/null; then
              echo '### Failed tests'
              echo '```'
              awk '/^==== [^ ]+ FAILED$/ {print; on = 0; next} /^==== .* FAILED$/ {on = 1} on {print}' tier.log | head -n 400
              echo '```'
            fi
          } > full-summary.md
          cat full-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate with the summary
        if: always() && steps.decide.outputs.work == 'true'
        uses: ./.github/actions/annotate
        with:
          file: full-summary.md
          title: full ${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.decide.outputs.work == 'true'
        with:
          name: windows-full-shard-${{ matrix.shard }}
          path: tier.log
          if-no-files-found: ignore
