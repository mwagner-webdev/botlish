name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs per program and backend (best is reported)
        default: "5"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - uses: actions/checkout@v5

      # Keep the devcontainer and GitHub Actions prerequisite setup in one
      # place so they stay in sync.
      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      # bench.tcl shells out to python3 and go to run the reference programs
      # under bench/equivalents/. Both ship on ubuntu-latest already, but the
      # job log still prints their versions so the benchmark environment is
      # explicit in CI.
      - name: Ensure Python toolchain
        run: python3 --version

      - name: Ensure Go toolchain
        run: go version

      # bench.tcl's native column, and bench/equivalents/rust/*.rs's own
      # column, both need the Cranelift backend built. bench.tcl itself
      # degrades a program's Cranelift column, not a failure, if this step
      # is ever skipped (n/a: never built this run) or a program can't be
      # lowered natively (unsupported: built, but this program uses a
      # construct native lowering has no implementation for -- see
      # bench.tcl's header and NATIVE-AUDIT.md).
      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      # Fails if the Botlish backends -- interp, compile, and native, once
      # native produces a value at all -- disagree on any benchmark's value
      # (the bench/equivalents/ Python and Rust columns are informational
      # and never gate, and neither does a benchmark native code can't run
      # at all: see bench.tcl's header). Timings from shared runners are
      # noisy, so they are reported but never gate either.
      - name: Run benchmarks
        shell: bash
        env:
          RUNS: ${{ inputs.runs || '5' }}
        run: tclsh9.0 bench/bench.tcl -runs "$RUNS" -markdown | tee bench.md

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Benchmarks"
            echo
            if [ -s bench.md ]; then cat bench.md; else echo "No results (benchmark failed to start)."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench.md
          if-no-files-found: ignore
