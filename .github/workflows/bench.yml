name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs per program and backend (best is reported)
        default: "5"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest (noble) ships only Tcl 8.6; Botlish's Tcl reference
      # implementation requires Tcl 9.x (see README's introduction and
      # core/core.tcl's version check), so Tcl 9 is installed from Ubuntu
      # 25.04 (plucky)'s universe pool instead.
      - name: Install Tcl 9
        run: |
          set -eu
          cd /tmp
          base=http://archive.ubuntu.com/ubuntu/pool/universe
          curl -fsSLO "$base/libt/libtommath/libtommath1_1.3.0-1_amd64.deb"
          curl -fsSLO "$base/t/tcl9.0/libtcl9.0_9.0.1+dfsg-1_amd64.deb"
          curl -fsSLO "$base/t/tcl9.0/tcl9.0_9.0.1+dfsg-1_amd64.deb"
          sudo dpkg -i libtommath1_1.3.0-1_amd64.deb libtcl9.0_9.0.1+dfsg-1_amd64.deb tcl9.0_9.0.1+dfsg-1_amd64.deb

      # bench.tcl shells out to python3 to run the reference programs under
      # bench/equivalents/. python3 ships on ubuntu-latest already; this
      # just prints its version for the job log.
      - name: Ensure Python toolchain
        run: python3 --version

      # native/Cargo.lock pins the dependency graph, so it is the cache key:
      # a hit skips rebuilding cranelift/wasmtime-internal-* (the bulk of
      # native/'s build time) entirely.
      - name: Cache native backend build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-cargo-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: native-cargo-${{ runner.os }}-

      # bench.tcl's native column, and bench/equivalents/rust/*.rs's own
      # column, both need the Cranelift backend built (rustc 1.95+ for the
      # pinned cranelift-*/wasmtime-internal-* crates -- see AGENTS.md;
      # ubuntu-latest's preinstalled default can be older, so this always
      # pins `stable` rather than trusting whatever is already selected).
      # bench.tcl itself degrades a program to n/a, not a failure, if this
      # step is ever skipped or a program can't be lowered natively (see
      # bench.tcl's header and NATIVE-AUDIT.md).
      - name: Build native backend
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --release --manifest-path native/Cargo.toml

      # Fails if the Botlish backends -- interp, compile, and native, once
      # native produces a value at all -- disagree on any benchmark's value
      # (the bench/equivalents/ Python and Rust columns are informational
      # and never gate, and neither does a benchmark native code can't run
      # at all: see bench.tcl's header). Timings from shared runners are
      # noisy, so they are reported but never gate either.
      - name: Run benchmarks
        shell: bash
        env:
          RUNS: ${{ inputs.runs || '5' }}
        run: tclsh9.0 bench/bench.tcl -runs "$RUNS" -markdown | tee bench.md

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Benchmarks"
            echo
            if [ -s bench.md ]; then cat bench.md; else echo "No results (benchmark failed to start)."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench.md
          if-no-files-found: ignore
