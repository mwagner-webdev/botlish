name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs per program and backend (best is reported)
        default: "5"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest (noble) ships only Tcl 8.6; Botlish's Tcl reference
      # implementation requires Tcl 9.x (see README's introduction and
      # core/core.tcl's version check), so Tcl 9 is installed from Ubuntu
      # 25.04 (plucky)'s universe pool instead.
      - name: Install Tcl 9
        run: |
          set -eu
          cd /tmp
          base=http://archive.ubuntu.com/ubuntu/pool/universe
          curl -fsSLO "$base/libt/libtommath/libtommath1_1.3.0-1_amd64.deb"
          curl -fsSLO "$base/t/tcl9.0/libtcl9.0_9.0.1+dfsg-1_amd64.deb"
          curl -fsSLO "$base/t/tcl9.0/tcl9.0_9.0.1+dfsg-1_amd64.deb"
          sudo dpkg -i libtommath1_1.3.0-1_amd64.deb libtcl9.0_9.0.1+dfsg-1_amd64.deb tcl9.0_9.0.1+dfsg-1_amd64.deb

      # bench.tcl shells out to python3 and rustc to run the reference
      # programs under bench/equivalents/ alongside the Botlish backends.
      # Both ship on ubuntu-latest already; this just makes sure and prints
      # versions for the job log.
      - name: Ensure Python and Rust toolchains
        run: |
          set -eu
          if ! command -v rustc >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          python3 --version
          "$HOME/.cargo/bin/rustc" --version 2>/dev/null || rustc --version

      # Fails if the Botlish backends disagree on any benchmark's value
      # (the bench/equivalents/ Python and Rust columns are informational
      # and never gate). Timings from shared runners are noisy, so they are
      # reported but never gate either.
      - name: Run benchmarks
        shell: bash
        env:
          RUNS: ${{ inputs.runs || '5' }}
        run: tclsh9.0 bench/bench.tcl -runs "$RUNS" -markdown | tee bench.md

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Benchmarks"
            echo
            if [ -s bench.md ]; then cat bench.md; else echo "No results (benchmark failed to start)."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench.md
          if-no-files-found: ignore
