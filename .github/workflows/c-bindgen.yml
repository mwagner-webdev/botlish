name: c-bindgen

# The C binding generator's gate (C-BINDGEN.md, "CI"; C-BINDGEN-LAYOUTS.md,
# "Regression and CI"): every committed binding is what generation produces
# from the pinned headers, for every target of its profile (the check mode,
# byte for byte, the layouts and their C verification included), and the
# generator's tests, its fuzzer and the layout fuzzer pass with the Tcl,
# BoringSSL, SDL3, Raven and Win32 acceptance enabled; and the Raven
# package (packages/raven, RAVEN-BINDINGS.md) over its generated binding,
# headless and on a real X11 window drawn by Raven's Vulkan renderer. The
# Win32 binding is generated on Linux with the MinGW-w64 cross toolchain
# (windows-x86_64-gnu): nothing here runs Windows, Wine, a Windows binary or
# any MSVC tool.
# The ordinary test jobs (tests.yml) run tests/c-bindgen.test too, but
# without the pinned sources or libraries: there only the synthetic
# fixture's tests run.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bindings:
    name: c-bindgen (generate, check, acceptance)
    runs-on: ubuntu-26.04
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - uses: actions/checkout@v5

      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      # clang preprocesses and probes every target (clang --target). The
      # AArch64 Linux targets read the arm64 C library's headers, which
      # clang finds through the GCC cross installation (gcc-aarch64-linux-
      # gnu brings libc6-dev-arm64-cross): without it clang would search
      # only the host's /usr/include, which the generator refuses
      # (C-BINDGEN.md, "Pipeline"). CMake and Ninja build BoringSSL and SDL3.
      # The windows-x86_64-gnu target reads MinGW-w64's headers and import
      # libraries (mingw-w64-x86-64-dev: the Win32 profile pins its version
      # macros, MinGW-w64 13.0.0), clang probes it (--target=
      # x86_64-w64-mingw32), llvm-nm reads the import libraries, and
      # MinGW-w64's GCC is the layouts' second compiler.
      - name: Install the C toolchain
        run: bash .devcontainer/setup-c-toolchain.sh

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      # The pinned header sources (Tcl, BoringSSL, SDL3): shallow clones at
      # the profiles' commits, checked on every use.
      - name: Cache the pinned C header sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/botlish/c-header-src
          key: c-header-src-${{ hashFiles('tools/c-bindgen/profiles/*.tcl', 'audit/c-header/profiles/*.tcl') }}

      - name: Fetch the pinned C header sources
        run: |
          for profile in tcl boringssl sdl3 raven; do
            tclsh9.0 tools/c-bindgen.tcl fetch $profile
          done

      # Every committed target (the fixture's four, the Linux targets of
      # the others: their macOS bindings need the macOS SDK's headers and
      # are generated on a Mac; Win32's windows-x86_64-gnu).
      - name: Check every committed binding
        run: |
          status=0
          for profile in fixture tcl tclstubs boringssl sdl3 raven win32; do
            tclsh9.0 tools/c-bindgen.tcl check $profile -target committed || status=1
          done
          exit $status

      - name: Cache the package-owned BoringSSL, SDL3 and Raven
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/botlish/boringssl
            ~/.cache/botlish/sdl3
            ~/.cache/botlish/raven
          key: cffi-libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/c-header/profiles/boringssl.tcl', 'tests/cffi/boringssl.tcl', 'tools/c-bindgen/profiles/sdl3.tcl', 'tests/cffi/sdl3.tcl', 'tools/c-bindgen/profiles/raven.tcl', 'tests/cffi/raven.tcl') }}

      # Raven twice: headless (its null platform and renderer: what the
      # binding's acceptance and the package's tests link) and for the
      # desktop (X11 and the Vulkan renderer, which loads libvulkan.so.1 when
      # a program runs: raven-desktop, under Xvfb with Mesa's software
      # Vulkan driver).
      - name: Install Raven's desktop prerequisites
        run: |
          sudo apt-get install -y --no-install-recommends libx11-dev libvulkan1 mesa-vulkan-drivers xvfb

      - name: Build the package-owned BoringSSL, SDL3 and Raven
        run: |
          tclsh9.0 tests/cffi/boringssl.tcl
          tclsh9.0 tests/cffi/sdl3.tcl
          tclsh9.0 tests/cffi/raven.tcl
          BOTLISH_RAVEN_CMAKE_FLAGS="" tclsh9.0 tests/cffi/raven.tcl

      - name: Run the generator's tests
        run: |
          tmp=$(mktemp -d)
          tclsh9.0 tests/c-bindgen.test -tmpdir "$tmp" | tee "$tmp/log"
          grep -qP 'Failed\t0$' "$tmp/log"
          ! grep -qP 'Skipped\t[1-9]' "$tmp/log"

      - name: Run the Raven package's tests
        run: |
          tmp=$(mktemp -d)
          tclsh9.0 tests/raven.test -tmpdir "$tmp" | tee "$tmp/log"
          grep -qP 'Failed\t0$' "$tmp/log"
          ! grep -qP 'Skipped\t[1-9]' "$tmp/log"

      - name: Fuzz the generator
        run: tclsh9.0 audit/c-bindgen/tools/fuzz.tcl -n 8 -seed ${{ github.run_number }} -keep 0

      # Random C records laid out by the compiler for the host and for every
      # cross target (the model, the generated static assertions and, on the
      # host, the runtime oracle on both native backends).
      - name: Fuzz the layouts
        run: |
          status=0
          for target in linux-x86_64 linux-aarch64 windows-x86_64-gnu macos-aarch64; do
            tclsh9.0 audit/c-bindgen/tools/layout-fuzz.tcl -n 4 -records 24 -seed ${{ github.run_number }} -target $target || status=1
          done
          exit $status
