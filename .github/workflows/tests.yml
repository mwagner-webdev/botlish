name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [interp, compile]
    env:
      # Tcl 9's default I/O encoding profile is strict: with no locale, the
      # system encoding falls back to iso8859-1, and writing the corpus's
      # non-ASCII/astral test output then fails outright instead of being
      # then fails outright instead of being silently mangled. C.utf8 is
      # built into glibc, so this needs no locale-gen step.
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - uses: actions/checkout@v5

      # Keep the devcontainer and GitHub Actions prerequisite setup in one
      # place so they stay in sync.
      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      # The corpus and native tests run every program on the Cranelift
      # backend too, whichever backend the suite targets.
      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - name: Run test suite
        env:
          CORE_BACKEND: ${{ matrix.backend }}
        run: tclsh9.0 tests/all.tcl

      - name: Run examples
        run: tclsh9.0 main.tcl -backend ${{ matrix.backend }}

  native:
    name: tests (cranelift coverage)
    runs-on: ubuntu-latest
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - uses: actions/checkout@v5

      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      # Runs the whole suite on cranelift and classifies every test; fails
      # only if a test fails for a reason other than a reported unsupported
      # construct. `shell: bash` runs it with pipefail: the default shell
      # (bash -e) takes tee's exit status, which hid a failing test here.
      - name: Native coverage
        shell: bash
        run: tclsh9.0 tests/native-coverage.tcl | tee coverage.txt

      # The corpus, the source samples and the HIR fixtures (native compiles
      # HIR, never core IR text: the examples/*.ir programs run on the Tcl
      # backends above); surface samples 09 and 10 expect an error (09 became a
      # rejection example with strict reference determinism).
      - name: Run examples
        run: tclsh9.0 main.tcl -backend cranelift examples/stdlib/*.bot examples/surface/0[1-8]*.bot examples/surface/1[1-3]*.bot examples/hir/0[1-3]*.hir

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Cranelift backend coverage"
            echo
            echo '```'
            cat coverage.txt 2>/dev/null || echo "No results."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gc-stress:
    name: tests (native GC-stress)
    # GC-stress forces a GC attempt at every allocation site, which is the
    # standard way to surface native stack-walking/root-tracking bugs (see
    # AGENTS.md). It's slower than a plain run, so it's push-only rather
    # than running on every PR too.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
      BOTLISH_NATIVE_GC_STRESS: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      # The runtime's own Rust unit tests, under the same stress (each test
      # roots what it holds in Rust locals, see Vm::temp_roots). Cheap: the
      # dependencies are already built, the tests run in well under a second.
      - name: Run native Rust unit tests under GC stress
        run: cargo test --release --manifest-path native/Cargo.toml

      - name: Run test suite under GC stress
        run: tclsh9.0 tests/all.tcl
