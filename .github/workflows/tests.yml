name: tests

on:
  push:
    # Every branch: a branch push runs the canary only (below).
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push (or run on the same ref) cancels the running one, on main
# too (CI-RUNS.md).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: canary (linux x86-64)
    # The likeliest to fail, first (CI-RUNS.md, "The canary"): the test files
    # and golden suites the push adds or changes, smallest first, then the
    # ones that failed in recent CI runs on this host (tests/canary.tsv),
    # within about ten minutes (tests/canary.tcl). It compares HEAD with
    # main's previous head on a push to main, with its merge base with main
    # otherwise. Before it, the two cheap gates: every mutant applies, and
    # the warning gate. They are steps here, not jobs, so that they gate the
    # rest without each waiting for a runner of its own (with the pool full
    # that wait was close to an hour, 2026-11-05); each step runs whatever an
    # earlier one found. Every other job waits for this one, so a push that
    # breaks them costs one runner for minutes, not every runner for hours.
    # On a branch push it is all that runs: dispatch the workflow on the
    # branch for the rest.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - uses: actions/checkout@v5
        with:
          # The history to the merge base, without file contents.
          fetch-depth: 0
          filter: blob:none

      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      # Every mutant of every audit's catalog still applies to this tree: its
      # text to replace occurs exactly once (MAIN-TEST-DEFECTS-2026-11.md).
      # The harnesses report a mutant that does not as NOT-APPLIED, but only
      # when they run, which is when their own area changes; a change
      # elsewhere that rewrites or duplicates the text it targets fails here
      # instead, on its own push. Reads files only: seconds.
      - name: Every mutant applies
        run: tclsh9.0 tools/mutant-catalogs.tcl -verbose 1

      # The shipped stdlib, libraries, examples and benchmarks compile with
      # exactly the warnings audit/refactor/manifest.txt lists, each with its
      # named obstruction, and every program without a manifest entry
      # compiles under -warnings error (REFACTOR-WARNINGS-CLEAN.md). A new
      # warning, a closed finding still listed, or a location that drifted
      # fails it. Warnings are discovered before any backend runs: no native
      # build needed. About two and a half minutes.
      - name: Warning gate
        if: ${{ !cancelled() }}
        run: tclsh9.0 audit/refactor/tools/gate.tcl

      - name: Build native (Cranelift) backend
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-native

      - name: Canary
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || 'origin/main' }}
        run: tclsh9.0 tests/canary.tcl -base "$BASE"

  test:
    name: tests (${{ matrix.backend }})
    needs: canary
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [interp, compile]
    env:
      # Tcl 9's default I/O encoding profile is strict: with no locale, the
      # system encoding falls back to iso8859-1, and writing the corpus's
      # non-ASCII/astral test output then fails outright instead of being
      # then fails outright instead of being silently mangled. C.utf8 is
      # built into glibc, so this needs no locale-gen step.
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - uses: actions/checkout@v5

      # Keep the devcontainer and GitHub Actions prerequisite setup in one
      # place so they stay in sync.
      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      # The corpus and native tests run every program on the Cranelift
      # backend too, whichever backend the suite targets.
      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      # The C FFI's SHA-256 acceptance (tests/c-ffi.test) links the
      # package-owned static BoringSSL, built once per pinned release into
      # Botlish's cache (C-FFI.md, "The BoringSSL binding"); without it those
      # tests are skipped.
      - name: Cache the package-owned BoringSSL
        uses: actions/cache@v4
        with:
          path: ~/.cache/botlish/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/c-header/profiles/boringssl.tcl', 'tests/cffi/boringssl.tcl') }}

      - name: Build the package-owned BoringSSL
        run: |
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build
          fi
          tclsh9.0 tests/cffi/boringssl.tcl

      # The language server under a real editor (tests/lsp-neovim.test,
      # LSP-MILESTONE-1.md, "Editors"): Neovim's built-in LSP client, a
      # pinned release, never a dependency of the compiler.
      - name: Install Neovim (for the language server's editor test)
        run: |
          curl -fsSLo "$RUNNER_TEMP/nvim.tar.gz" https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/nvim.tar.gz"
          echo "BOTLISH_NVIM=$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" >> "$GITHUB_ENV"

      - name: Run test suite
        env:
          CORE_BACKEND: ${{ matrix.backend }}
        run: tclsh9.0 tests/all.tcl

      - name: Run examples
        # The core IR samples, named explicitly: without a file main.tcl
        # prints its usage summary (COMPILERPEDIA.md).
        run: tclsh9.0 main.tcl -backend ${{ matrix.backend }} examples/*.ir

  native:
    # The whole suite with each native backend as CORE_BACKEND: specialized
    # (cranelift) and unspecialized (cranelift-generic, -specialize 0).
    name: tests (${{ matrix.backend }} coverage)
    needs: canary
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cranelift, cranelift-generic]
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - uses: actions/checkout@v5

      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      # Runs the whole suite on cranelift and classifies every test; fails
      # only if a test fails for a reason other than a reported unsupported
      # construct. `shell: bash` runs it with pipefail: the default shell
      # (bash -e) takes tee's exit status, which hid a failing test here.
      - name: Native coverage
        shell: bash
        run: tclsh9.0 tests/native-coverage.tcl -backend ${{ matrix.backend }} | tee coverage.txt

      # The corpus, the source samples and the HIR fixtures (native compiles
      # HIR, never core IR text: the examples/*.ir programs run on the Tcl
      # backends above); surface samples 09 and 10 expect an error (09 became a
      # rejection example with strict reference determinism). Specialized
      # only: unspecialized native code has no slot for a projection only a
      # semantic instance proves (STRUCTS.md, "Known limitations"), so
      # csv_records.bot and hashtable.bot are NATIVE UNSUPPORTED struct-shape
      # on cranelift-generic; the corpus tests run every program there, with
      # the specialized outcome standing in (tests/helpers.tcl,
      # GenericBaselineUndefined).
      - name: Run examples
        if: matrix.backend == 'cranelift'
        run: tclsh9.0 main.tcl -backend cranelift examples/stdlib/*.bot examples/surface/0[1-8]*.bot examples/surface/1[1-3]*.bot examples/hir/0[1-3]*.hir

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.backend }} backend coverage"
            echo
            echo '```'
            cat coverage.txt 2>/dev/null || echo "No results."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: tests (native Rust unit tests)
    needs: canary
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    # The native runtime's and code generator's own Rust tests, unstressed,
    # on every push and pull request (the gc-stress job below runs them again
    # under GC stress, on pushes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - name: Run native Rust unit tests
        run: cargo test --release --manifest-path native/Cargo.toml

  stub-linker:
    name: tests (stub-linked executables)
    needs: canary
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    # Every test file that builds a standalone executable, with executables
    # linked by the toolchain-free `stub` linker the single-file compiler uses
    # (SINGLE-EXECUTABLE.md) instead of rustc. The tests that read a
    # rustc-linked executable's Botlish function symbols (objdump, strace
    # stacks) or rustc's invocation are constrained to rustcLinker
    # (tests/helpers.tcl) and skip here; tests/aot-stub-linker.test compares
    # the two linkers' executables directly.
    runs-on: ubuntu-latest
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
      CORE_BACKEND: compile
      BOTLISH_NATIVE_LINKER: stub
    steps:
      - uses: actions/checkout@v5

      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - name: Executable tests, stub-linked
        shell: bash
        run: |
          files=$(grep -l -e 'native::executable' -e 'emit-native-executable' tests/*.test | xargs -n1 basename | tr '\n' ' ')
          tclsh9.0 tests/all.tcl -file "$files"

  system-linker:
    name: tests (system-linked executables)
    needs: canary
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    # Every test file that builds a standalone executable or links a program
    # that calls C, with executables linked by the `system` linker the
    # single-file compiler uses for programs that call C
    # (SINGLE-EXECUTABLE-FFI-MILESTONE-1.md): the host's cc, the program
    # object and the precompiled runtime archive -- no rustc at link time. The tests of rustc's own invocation are
    # constrained to rustcLinker (tests/helpers.tcl) and skip here;
    # tests/system-linker.test compares the linkers' executables directly.
    runs-on: ubuntu-latest
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
      CORE_BACKEND: compile
      BOTLISH_NATIVE_LINKER: system
    steps:
      - uses: actions/checkout@v5

      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - name: What the system linker links with
        run: native/target/release/botlish-native system-linker

      # The libraries the driver passes after the runtime archive, against
      # rustc's account of them (relinks the archive: before any test runs).
      - name: The runtime archive's system libraries
        run: tclsh9.0 native/runtime-archive/libraries.tcl

      - name: Executable and C tests, system-linked
        shell: bash
        run: |
          files=$(grep -l -e 'native::executable' -e 'emit-native-executable' -e 'extern c ' tests/*.test | xargs -n1 basename | tr '\n' ' ')
          tclsh9.0 tests/all.tcl -file "$files"

      - name: Executable and C tests, system-linked, under GC stress
        shell: bash
        env:
          BOTLISH_NATIVE_GC_STRESS: "1"
        run: |
          tclsh9.0 tests/all.tcl -file "system-linker.test c-ffi.test c-byte-borrowing.test c-ffi-error-capture.test coroutines.test native-link-plan.test"

  method-filter:
    name: method-call decision (oracle, reference audit)
    needs: canary
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    # The method-call decision (hir/methods.tcl,
    # METHOD-RESOLUTION-CORRECTNESS-MILESTONE-1.md) judges a candidate by the
    # call's own checks, certified relative to the decided program; its kind
    # proofs (METHOD-DECISION-FILTER.md) save builds and must change no
    # decision. The job runs the unit tests, the independent oracle (also
    # with candidates that require contexts the installations may not
    # provide, which must decide nothing: SFIAE-MILESTONE-1.md), the
    # fuzzer (every program under the reference audit, the audit of build
    # reuse and plainly) and every golden suite that decides method calls
    # under hir::methodReferenceAudit, which decides by the reference rule
    # (every candidate judged by its own build) as well and fails on any
    # difference. The front end only: no native build is needed. (The
    # mutation harnesses, audit/method-resolution/tools/mutate.tcl and
    # audit/method-filter/tools/mutate.tcl, are run by hand.)
    runs-on: ubuntu-latest
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - uses: actions/checkout@v5

      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      - name: Tests, oracle and fuzzer
        run: |
          tclsh9.0 tests/method-resolution.test -tmpdir "$(mktemp -d)"
          tclsh9.0 tests/method-filter.test -tmpdir "$(mktemp -d)"
          tclsh9.0 audit/method-resolution/tools/oracle.tcl 500 1
          tclsh9.0 audit/method-resolution/tools/oracle.tcl 300 1 -contexts 1
          tclsh9.0 audit/method-filter/tools/fuzz.tcl 20 1

      - name: Golden suites under the reference audit
        run: tclsh9.0 bench/method-filter.tcl -audit 1 -suites

  golden:
    name: golden suites (Botlish-native tests, shard ${{ matrix.shard }}/4)
    needs: canary
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    # The Botlish golden test suites (tests/golden/*.bot, stdlib/test.bot,
    # GOLDEN-TEST-FRAMEWORK.md, LARGE-SCALE-GOLDEN-MIGRATION.md) on every
    # backend, side by side with the Tcl tests they were ported from: every
    # Tcl test tests/golden/manifest.tsv lists as ported, and the golden test
    # it became, must both pass on this revision, every suite must compile,
    # run on every backend it does not exclude with one report, and report
    # exactly the manifest's tests. The suites are split into four shards by
    # file name (check.tcl -shard): one job each, in parallel. The Tcl tests
    # stay authoritative; tests/golden.test also runs the validation sample's
    # suites inside the ordinary test jobs.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
    steps:
      - uses: actions/checkout@v5

      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      - name: Golden suites and their Tcl originals, side by side
        run: tclsh9.0 audit/golden/tools/check.tcl -shard ${{ matrix.shard }}/4 -jobs 2

  gc-stress:
    name: tests (native GC-stress, ${{ matrix.backend }})
    needs: canary
    # GC-stress forces a GC attempt at every allocation site, which is the
    # standard way to surface native stack-walking/root-tracking bugs (see
    # AGENTS.md). It's slower than a plain run, so it runs on pushes to main
    # only: not on pull requests, manual runs or branch pushes.
    # One job per Tcl backend pass, as in tests-arm64.yml: both passes in one
    # job ran one after the other, 3 h 48 min of the job's 4 h 1 min on main
    # (run 42358112066), the workflow's slowest job. Both passes are kept:
    # the stress reaches only the native runs inside each pass's test files,
    # and some files run cranelift in the interp pass and cranelift-generic
    # only in the compile pass (actor.test, event-loop.test, golden.test, ...).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [interp, compile]
    env:
      LANG: C.utf8
      LC_ALL: C.utf8
      BOTLISH_NATIVE_GC_STRESS: "1"
      CORE_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v5

      - name: Install project prerequisites
        run: bash .devcontainer/setup.sh

      - name: Build native (Cranelift) backend
        uses: ./.github/actions/build-native

      # The runtime's own Rust unit tests, under the same stress (each test
      # roots what it holds in Rust locals, see Vm::temp_roots), once: in
      # the compile pass's job, the shorter of the two. About 12 minutes,
      # nearly all of it transfer_deep_trees_iteratively (run 42358112066).
      - name: Run native Rust unit tests under GC stress
        if: matrix.backend == 'compile'
        run: cargo test --release --manifest-path native/Cargo.toml

      - name: Run test suite under GC stress
        run: tclsh9.0 tests/all.tcl
