[package]
name = "botlish-native"
version = "0.1.0"
edition = "2024"
publish = false

# The runtime library: an rlib for executables (the rustc linker's startup
# crate links it) and a static archive for native libraries
# (NATIVE-LIBRARY-MILESTONE-1.md: native::library partially links it with a
# library's program object and keeps only the library's public symbols
# global).
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
cranelift-codegen = { version = "0.135", features = ["trace-log"] }
cranelift-frontend = "0.135"
cranelift-module = "0.135"
cranelift-jit = "0.135"
cranelift-object = "0.135"
cranelift-native = "0.135"
log = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
unicode-general-category = "1.1.0"
libc = "0.2"
# The compilation target's triple (codegen/target.rs): the same version
# Cranelift resolves.
target-lexicon = "0.13"

# Windows' unwinder (RtlVirtualUnwind and the JIT's function tables), the
# JIT's code range and the thread's stack bounds
# (WINDOWS-X86-64-MILESTONE-3.md); the stack-overflow guard's handler, its
# stack guarantee and its report (WINDOWS-X86-64-MILESTONE-4.md: WriteFile,
# the standard handles, the exception record's flags); coroutine fibers
# (WINDOWS-X86-64-MILESTONE-5.md: FIBER_FLAG_FLOAT_SWITCH is
# WindowsProgramming's).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

# The runtime archive (native/runtime-archive) is a member built with the
# driver: one `cargo build` makes botlish-native, botlish-aot-stub and the
# archive the system linker links (SINGLE-EXECUTABLE-FFI-MILESTONE-1.md).
[workspace]
members = [".", "runtime-archive"]
default-members = [".", "runtime-archive"]

# The native stack test's threads of CreateThread's own (tests/native_stack/
# windows.rs): Rust's runtime set no stack guarantee for them.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security"] }

[profile.release]
debug = 1

[features]
# The GC root plan of a host without native-frame roots -- the shadow stack,
# leaf frames published through Vm::native_roots_ptr, no frame walk
# (runtime::framewalk's NATIVE_FRAME_ROOTS false), Windows' plan -- built on
# a host that has them, to test that plan where the whole suite runs
# (WINDOWS-X86-64-MILESTONE-1.md, section 3). A test build, never shipped.
fallback-roots = []

# The host's native stack bounds and guards, and the runtime's overflow
# handling (MACOS-AARCH64-MILESTONE-4.md): its own main runs on the process's
# main thread, and every check that faults on purpose runs in a child
# process.
[[test]]
name = "native_stack"
harness = false
